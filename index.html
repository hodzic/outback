<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12324A">
<title>Outback</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --ink:#12324A; --muted:#5B7183; --line:#D5DEE6; --paper:#FFFFFF; --wash:#EEF3F7;
  --magenta:#C8167E; --flood:#1F6FB2; --ebb:#2E8B57; --land:#F3E2A9; --warn:#B3261E;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--wash);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:#cfe3ee}
.leaflet-control-attribution{font-size:10px}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:1000;display:flex;gap:6px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0 8px;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:22px;height:40px;padding:0 14px;
  box-shadow:0 1px 3px rgba(18,50,74,.18);font-size:15px}
.pill.icon{width:40px;padding:0;font-size:20px}
#tripBtn{font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#date{padding:0 10px;min-width:0;width:140px}
.grow{flex:1}

/* nav strip (paddle mode) */
#nav{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:1000;
  background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#nav[hidden]{display:none}
#nav .k{font-size:12px;opacity:.75}
#nav .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#nav .wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:14px}
#nav button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:16px;padding:4px 12px}

/* bottom panel */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);
  border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(18,50,74,.18);
  padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
#handle{display:block;width:100%;height:30px;border:0;background:none;padding:0;touch-action:none;cursor:grab}
#handle::after{content:"";display:block;margin:8px auto;width:52px;height:6px;border-radius:3px;background:#A9B8C5}
#panel.min .full,#panel.min .read,#panel.min #status{display:none}
#mini{display:none;width:100%;border:0;background:none;padding:0 0 8px;text-align:left;font-size:15px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panel.min #mini{display:block}
#mini .w{color:var(--warn);font-weight:700}
#routeBtn{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:2px 0 6px;text-align:left}
#dist{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#legs{color:var(--muted);font-size:14px}
#chart{display:block;width:100%;height:96px;touch-action:none}
.slider{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.slider input{flex:1;accent-color:var(--magenta)}
#timeOut{font-weight:700;font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.btn{background:var(--wash);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 12px;font-size:15px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{padding:6px 8px;background:var(--paper);min-width:0}
.cell[hidden]{display:none}
.cell .k{font-size:12px;color:var(--muted)}
.cell .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.flood{color:var(--flood)} .v.ebb{color:var(--ebb)} .v.warn{color:var(--warn)}
.top-row{display:flex;align-items:center;gap:8px}
.top-row #routeBtn{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--paper);padding:5px 9px;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.seg[hidden]{display:none}
#status{margin:6px 0 4px;font-size:13px;color:var(--muted);min-height:1em}
#status.warn{color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1.4fr 1fr 48px;gap:8px}
.actions button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:16px;font-weight:700}
.actions .primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.actions .on{background:var(--ink);border-color:var(--ink);color:#fff}

/* draw hint */
#drawBar,#mapBar{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:1000;
  background:var(--paper);border:2px solid var(--magenta);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
#drawBar[hidden],#mapBar[hidden]{display:none}
#drawBar span,#mapBar .txt{flex:1;font-size:15px;min-width:0}
#mapBar{flex-wrap:wrap}
#mapBar input,#mapBar select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 8px;min-width:0}
#mapBar input{flex:1 1 140px}
#mapBar .est{flex-basis:100%;font-size:13px;color:var(--muted)}
#mapBar .est.err{color:var(--warn)}
#mapBar .prog{flex-basis:100%;height:6px;background:var(--wash);border-radius:3px;overflow:hidden}
#mapBar .prog i{display:block;height:100%;width:0;background:var(--magenta)}

/* map markers */
.wp{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--magenta);
  font:700 12px/20px var(--font);text-align:center;color:var(--magenta)}
.wp.next{background:var(--magenta);color:#fff}
.leg{background:rgba(255,255,255,.92);border:1px solid var(--magenta);color:var(--magenta);font:700 12px var(--font);
  padding:1px 5px;border-radius:6px;box-shadow:none}
.leg::before{display:none}
.st{width:22px;height:22px;border-radius:4px;background:#fff;border:2px solid var(--ink);font:700 11px/18px var(--font);text-align:center}
.st.tide{border-color:var(--ink)} .st.cur{border-color:var(--flood);transform:rotate(45deg)}
.st.cur span{display:inline-block;transform:rotate(-45deg)}
.st.dim{opacity:.6;transform:scale(.8)} .st.cur.dim{transform:rotate(45deg) scale(.8)}
.arrow svg{filter:drop-shadow(0 0 2px #fff)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35)}

/* sheet */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);max-height:84vh;color:var(--ink)}
dialog::backdrop{background:rgba(18,50,74,.4)}
.sh{padding:16px}
.sh h2{margin:0 0 10px;font-size:20px}
.sh .list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.sh .item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.sh .item .grow{min-width:0}
.sh .item small{display:block;color:var(--muted)}
.sh .menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font-size:16px}
.sh label{display:block;margin:10px 0 4px;font-weight:700}
.sh input[type=number],.sh input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.sh .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sh table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.sh td,.sh th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.sh td:first-child,.sh th:first-child{text-align:left}
.sh p{line-height:1.45}
.danger{color:var(--warn)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3000;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}

/* tracks, location, trail maps */
.me.stale{background:#8aa4bd}
#locBtn.on{background:#1a73e8;color:#fff;border-color:#1a73e8}
#locBtn.watch{color:#1a73e8;border-color:#1a73e8}
#coords{position:fixed;right:8px;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:999;background:rgba(255,255,255,.9);
  border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:12px;font-variant-numeric:tabular-nums}
#coords[hidden]{display:none}
#nav .rec{color:#ff8a80;font-weight:700}
#opBar{position:fixed;right:6px;top:40%;z-index:999;background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:12px;
  padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
#opBar[hidden]{display:none}
#opacity{writing-mode:vertical-lr;direction:rtl;height:140px;width:24px;accent-color:var(--ink)}
.nudge{width:22px;height:22px;border-radius:50%;background:var(--magenta);border:3px solid #fff;box-shadow:0 0 0 1px var(--magenta)}
.nudge-c{width:34px;height:34px;border-radius:50%;background:rgba(18,50,74,.85);color:#fff;font:20px/34px var(--font);text-align:center}
.cell.wide{grid-column:1/-1}
.sh h3{margin:14px 0 4px;font-size:16px}
.sh .item img{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.sh .item .grow{flex:1}
.sh .add{width:100%;height:42px;margin-top:4px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.choices button{height:56px;border:1px solid var(--line);border-radius:12px;background:var(--paper);font-size:17px;font-weight:700}
.choices button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.choices small{display:block;font-weight:400;font-size:12px;opacity:.8}
</style>
</head>
<body>
<div id="map"></div>

<header id="top">
  <button id="tripBtn" class="pill" aria-label="My trips">New trip</button>
  <input id="date" class="pill" type="date" aria-label="Trip date">
  <span class="grow"></span>
  <button id="layerBtn" class="pill">Chart</button>
  <button id="locBtn" class="pill icon" aria-label="Show and follow my location">◎</button>
</header>
<div id="coords" hidden></div>

<div id="drawBar" hidden>
  <span>Tap the map to add waypoints. Drag to move. Tap a leg for its details.</span>
  <button id="undoBtn" class="btn">Undo</button>
  <button id="doneBtn" class="btn">Done</button>
</div>
<div id="mapBar" hidden></div>

<div id="opBar" hidden><span>Map</span><input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.8" aria-label="Trail map opacity"><span id="opVal">80%</span></div>

<div id="nav" hidden>
  <div><div class="k" id="navTo">To 2</div><div class="v" id="navDist">–</div></div>
  <div><div class="k" id="navBrgK">Bearing</div><div class="v" id="navBrg">–</div></div>
  <div><div class="k" id="navSogK">Speed</div><div class="v" id="navSog">–</div></div>
  <div><div class="k" id="navEtaK">Finish</div><div class="v" id="navEta">–</div></div>
  <div class="wide"><span id="navLeft">–</span><button id="stopBtn">Stop</button></div>
</div>

<section id="panel">
  <button id="handle" aria-label="Expand or collapse forecast panel"></button>
  <button id="mini" aria-label="Show forecast"></button>
  <div class="full">
    <div class="top-row">
      <button id="routeBtn"><span id="dist">0.0 nm</span><span id="legs">Tap Draw to plot a route</span></button>
      <div class="seg" id="graphSel" role="group" aria-label="Graph"></div>
    </div>
    <canvas id="chart" aria-label="Day graph for the trip"></canvas>
    <div class="slider">
      <input id="time" type="range" min="0" max="1435" step="5" aria-label="Time of day">
      <output id="timeOut"></output>
      <button id="nowBtn" class="btn">Now</button>
    </div>
  </div>
  <div class="read">
    <div class="cell tidal"><div class="k" id="tideK">Tide</div><div class="v" id="tideV">–</div><div class="s" id="tideS">&nbsp;</div></div>
    <div class="cell curc"><div class="k" id="curK">Current</div><div class="v" id="curV">–</div><div class="s" id="curS">&nbsp;</div></div>
    <div class="cell elevc"><div class="k">Elevation</div><div class="v" id="elevV">–</div><div class="s" id="elevS">&nbsp;</div></div>
    <div class="cell"><div class="k">Wind</div><div class="v" id="windV">–</div><div class="s" id="windS">&nbsp;</div></div>
    <div class="cell"><div class="k">Pressure</div><div class="v" id="presV">–</div><div class="s" id="presS">&nbsp;</div></div>
    <div class="cell"><div class="k">Lightning</div><div class="v" id="ltgV">–</div><div class="s" id="ltgS">&nbsp;</div></div>
    <div class="cell"><div class="k">Sun</div><div class="v" id="sunV">–</div><div class="s" id="sunS">&nbsp;</div></div>
  </div>
  <p id="status"></p>
  <div class="actions">
    <button id="drawBtn">Draw</button>
    <button id="fcBtn" class="primary">Get forecast</button>
    <button id="goBtn">Go</button>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </div>
</section>

<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>
<input id="file" type="file" accept=".json,.gpx,application/json,application/gpx+xml" hidden>
<input id="pdfFile" type="file" accept=".pdf,application/pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="vendor/Leaflet.ImageOverlay.Rotated.js"></script>
<script>
'use strict';
/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
// Storage keys keep the original "paddle" names so trips made before the rename to Outback still load.
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('paddle.'+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem('paddle.'+k, JSON.stringify(v)); }catch{} }
};
const settings = Object.assign({ speeds: { paddle: 3, hike: 2.5 }, variation: 13, layer: 'chart', gust: 15, graph: 'tide', shownMaps: [] }, LS.get('settings', {}));
if (typeof settings.speed === 'number'){ settings.speeds = { ...settings.speeds, paddle: settings.speed }; delete settings.speed; }
const saveSettings = () => LS.set('settings', settings);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg, ms = 2800){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

/* ---------- IndexedDB ---------- */
let dbp;
function db(){
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('paddle', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const [n, o] of [['trips', { keyPath: 'id' }], ['kv'], ['regions', { keyPath: 'id' }], ['trailMaps', { keyPath: 'id' }]])
        if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, o);
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  });
}
const idb = {
  get: (st, k) => tx(st, 'readonly', s => s.get(k)),
  put: (st, v, k) => tx(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)),
  del: (st, k) => tx(st, 'readwrite', s => s.delete(k)),
  all: st => tx(st, 'readonly', s => s.getAll())
};

/* ---------- activities and settings ---------- */
// Distances are stored in nautical miles and shown in the activity's unit.
const ACT = {
  paddle: { name: 'Paddle', unit: 'nm', k: 1, spd: 'kt', small: [1852, 'm'], arrive: 0.05, layer: 'chart', envs: ['ocean', 'bay', 'slough', 'river', 'lake'] },
  hike:   { name: 'Hike', unit: 'mi', k: 1.15078, spd: 'mph', small: [6076, 'ft'], arrive: 0.02, layer: 'topo', envs: ['trail', 'coast'] }
};
const ENV = {
  ocean: { name: 'Ocean', tides: true, currents: true }, bay: { name: 'Bay', tides: true, currents: true },
  slough: { name: 'Slough / estuary', tides: true, currents: true }, river: { name: 'River' }, lake: { name: 'Lake' },
  trail: { name: 'Trail' }, coast: { name: 'Coast / beach', tides: true }
};
const act = () => ACT[trip?.activity] || ACT.paddle;
const env = () => ENV[trip?.env] || {};
const isHike = () => trip?.activity === 'hike';
const isTidal = () => !!env().tides;
const hasCurrents = () => !!env().currents;
const speed = () => settings.speeds[trip?.activity || 'paddle'] || 3;
const dU = nm => nm * act().k;                       // nm -> display unit
const fmtD = (nm, dp = 1) => dU(nm).toFixed(dp) + ' ' + act().unit;
const fmtNear = nm => nm < 0.1 ? Math.round(nm * act().small[0]) + ' ' + act().small[1] : fmtD(nm, 2);
const wU = kt => isHike() ? kt * 1.15078 : kt;      // wind is fetched in knots
const wUnit = () => isHike() ? 'mph' : 'kt';
// Hike time uses Naismith's rule: +1 h per 2000 ft of climb.
const hoursFor = (nm, climbFt = 0) => dU(nm) / speed() + (isHike() ? climbFt / 2000 : 0);

/* ---------- geo + time helpers ---------- */
const toR = d => d * Math.PI / 180, toD = r => r * 180 / Math.PI;
function distNm(a, b){
  const dLat = toR(b[0]-a[0]), dLng = toR(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2 * 3440.065 * Math.asin(Math.sqrt(h));
}
function brgT(a, b){
  const y = Math.sin(toR(b[1]-a[1])) * Math.cos(toR(b[0]));
  const x = Math.cos(toR(a[0]))*Math.sin(toR(b[0])) - Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));
  return (toD(Math.atan2(y, x)) + 360) % 360;
}
const d3 = n => String(Math.round(((n % 360) + 360) % 360)).padStart(3, '0');
const magB = t => d3(t - settings.variation) + '°M';
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass = d => COMPASS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shiftDay = (iso, n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return ymd(d); };
// Times are shown in the trip's own time zone (learned from the forecast), else the device's.
const tz = () => trip?.tz || undefined;
const hm = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', timeZone: tz() });
function zParts(ms){
  const o = {}; for (const p of new Intl.DateTimeFormat('en-US', { timeZone: tz(), hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).formatToParts(ms)) o[p.type] = p.value;
  return { ymd: `${o.year}-${o.month}-${o.day}`, min: (+o.hour % 24) * 60 + +o.minute, off: Date.UTC(+o.year, o.month - 1, +o.day, +o.hour % 24, +o.minute) - Math.floor(ms / 6e4) * 6e4 };
}
const todayIso = () => zParts(Date.now()).ymd;
const nowMin = () => zParts(Date.now()).min;
function dayStart(){
  const u = Date.parse(trip.date + 'T00:00Z');
  let t = u - zParts(u).off; t = u - zParts(t).off; return t;
}
const tAt = () => dayStart() + state.tMin * 6e4;
const routeNm = r => r.reduce((s, p, i) => i ? s + distNm(r[i-1], p) : 0, 0);
const fmtDur = h => { const m = Math.round(h * 60); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m % 60).padStart(2,'0')}`; };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.round(b / 1024) + ' KB';
function centroid(){
  if (trip.route.length){ const n = trip.route.length; return [trip.route.reduce((s,p)=>s+p[0],0)/n, trip.route.reduce((s,p)=>s+p[1],0)/n]; }
  const c = map.getCenter(); return [c.lat, c.lng];
}
// Douglas-Peucker, tolerance in nm (flat approximation is fine at trail scale)
function simplify(pts, tol){
  if (pts.length < 3) return pts.slice();
  const k = Math.cos(toR(pts[0][0]));
  const xy = p => [p[1] * 60 * k, p[0] * 60];
  const segD = (p, a, b) => { const [px, py] = xy(p), [ax, ay] = xy(a), [bx, by] = xy(b), dx = bx-ax, dy = by-ay, L2 = dx*dx + dy*dy;
    const t = L2 ? Math.max(0, Math.min(1, ((px-ax)*dx + (py-ay)*dy) / L2)) : 0; return Math.hypot(px - ax - t*dx, py - ay - t*dy); };
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length-1] = 1;
  const stack = [[0, pts.length - 1]];
  while (stack.length){
    const [i, j] = stack.pop(); let md = 0, mi = -1;
    for (let m = i + 1; m < j; m++){ const d = segD(pts[m], pts[i], pts[j]); if (d > md){ md = d; mi = m; } }
    if (md > tol){ keep[mi] = 1; stack.push([i, mi], [mi, j]); }
  }
  return pts.filter((_, i) => keep[i]);
}

/* ---------- sun (after SunCalc, V. Agafonkin, BSD) ---------- */
function sunTimes(dateIso, lat, lng){
  const rad = Math.PI/180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad*23.4397, J0 = 0.0009;
  const date = Date.parse(dateIso+'T12:00Z') - lng / 15 * 36e5; // local solar noon
  const d = date/dayMs - 0.5 + J1970 - J2000;
  const lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw/(2*Math.PI));
  const approx = (Ht) => J0 + (Ht + lw)/(2*Math.PI) + n;
  const ds = approx(0);
  const M = rad*(357.5291 + 0.98560028*ds);
  const L = M + rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M)) + rad*102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const transit = (x) => J2000 + x + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const Jnoon = transit(ds);
  const fromJ = j => (j + 0.5 - J1970) * dayMs;
  const pair = (h) => {
    const w = Math.acos((Math.sin(h*rad) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec)));
    if (isNaN(w)) return [null, null];
    const Jset = transit(approx(w)); return [fromJ(Jnoon - (Jset - Jnoon)), fromJ(Jset)];
  };
  const [rise, set] = pair(-0.833), [dawn, dusk] = pair(-6);
  return { rise, set, dawn, dusk };
}

const state = { legs: new Set(), tMin: 600, drawing: false, going: false, next: 1, pos: null, acc: null, sog: null, watch: null, wake: null,
  follow: false, locating: false, showStations: false, rec: null, recSaved: 0 };

function newTrip(activity = 'paddle'){
  return { id: 't' + Date.now().toString(36), name: 'New trip', activity, env: null, envSet: false, date: ymd(new Date()), route: [], tracks: [],
    tide: null, current: null, data: null, fetchedAt: null, updated: Date.now() };
}
// Bring trips saved by older versions (Paddle) up to the current shape.
function normTrip(t){
  t.activity = t.activity || 'paddle';
  if (t.env === undefined){ t.env = t.water === 'tidal' ? 'bay' : t.water === 'lake' ? 'lake' : null; t.envSet = !!t.waterSet; }
  delete t.water; delete t.waterSet;
  t.tracks = t.tracks || [];
  for (const k of t.tracks) if (!k.end) k.end = k.pts.length ? k.pts[k.pts.length - 1][2] : k.start; // recording cut off by a reload
  return t;
}

function setLayer(k){

function drawRoute(){
  routeLayer.clearLayers();
  const r = trip.route;
  if (r.length > 1) L.polyline(r, { color: '#C8167E', weight: 4, opacity: .9, interactive: false }).addTo(routeLayer);
  r.forEach((p, i) => {
    if (i){
      const a = r[i-1], mid = [(a[0]+p[0])/2, (a[1]+p[1])/2];
      // wide invisible line = easy tap target; tap toggles this leg's label
      const hit = L.polyline([a, p], { color: '#000', weight: 22, opacity: 0 }).addTo(routeLayer);
      hit.on('click', e => { L.DomEvent.stop(e); state.legs.has(i) ? state.legs.delete(i) : state.legs.add(i); drawRoute(); });
      if (state.legs.has(i)){
        const d = distNm(a, p);
        L.tooltip({ permanent: true, direction: 'center', className: 'leg' }).setLatLng(mid)
          .setContent(`${fmtD(d, 2)} · ${magB(brgT(a,p))} · ${fmtDur(hoursFor(d))}`).addTo(routeLayer);
      }
    }
    const isNext = state.going && i === state.next;
    const m = L.marker(p, { draggable: state.drawing, icon: L.divIcon({ className: '', html: `<div class="wp${isNext?' next':''}">${i+1}</div>`, iconSize: [26,26], iconAnchor: [13,13] }) }).addTo(routeLayer);
    m.on('dragend', () => { const ll = m.getLatLng(); trip.route[i] = [ll.lat, ll.lng]; changed(); });
    m.bindPopup(() => `<b>Waypoint ${i+1}</b><br>${p[0].toFixed(5)}, ${p[1].toFixed(5)}<br>
      ${state.going ? `<button class="btn" data-goto="${i}">Go here</button>` : `<button class="btn" data-del="${i}">Delete</button>`}`);
  });
}
function drawTracks(){
  trackLayer.clearLayers(); recLine = null;
  for (const k of trip.tracks){
    if (k.pts.length < 2) continue;
    const line = L.polyline(k.pts.map(p => [p[0], p[1]]), { color: '#1a73e8', weight: 3, opacity: .85, dashArray: k === state.rec ? null : '6 6' }).addTo(trackLayer);
    if (k === state.rec) recLine = line;
    else line.bindPopup(() => `<b>Track</b><br>${esc(trackLabel(k))}`);
  }
}
map.on('click', e => {

document.addEventListener('click', e => {

});

/* ---------- stations ---------- */
const stIcon = (kind, label, dim) => L.divIcon({ className: '', html: `<div class="st ${kind}${dim?' dim':''}"><span>${label}</span></div>`, iconSize: [22,22], iconAnchor: [11,11] });
function drawStations(){
  stationLayer.clearLayers();
  if (curArrow){ map.removeLayer(curArrow); curArrow = null; }
  if (!isTidal()) return;
  if (trip.tide) L.marker([trip.tide.lat, trip.tide.lng], { icon: stIcon('tide', 'T') }).bindPopup(`<b>Tide station</b><br>${esc(trip.tide.name)}<br><small>${esc(trip.tide.id)}</small>`).addTo(stationLayer);
  if (hasCurrents() && trip.current) L.marker([trip.current.lat, trip.current.lng], { icon: stIcon('cur', 'C') }).bindPopup(`<b>Current station</b><br>${esc(trip.current.name)}<br><small>${esc(trip.current.id)}${trip.current.depth ? ' · depth '+esc(trip.current.depth)+' ft' : ''}</small>`).addTo(stationLayer);
  if (state.showStations && state.nearby){
    for (const s of state.nearby.tide) if (!trip.tide || s.id !== trip.tide.id)
      L.marker([s.lat, s.lng], { icon: stIcon('tide', 'T', true) }).bindPopup(`<b>${esc(s.name)}</b><br><small>Tide · ${esc(s.id)}</small><br><button class="btn" data-use="tide" data-id="${esc(s.id)}">Use for tides</button>`).addTo(stationLayer);
    if (hasCurrents()) for (const s of state.nearby.current) if (!trip.current || s.id !== trip.current.id)
      L.marker([s.lat, s.lng], { icon: stIcon('cur', 'C', true) }).bindPopup(`<b>${esc(s.name)}</b><br><small>Current · ${esc(s.id)}${s.depth ? ' · depth '+esc(s.depth)+' ft':''}</small><br><button class="btn" data-use="current" data-id="${esc(s.id)}">Use for currents</button>`).addTo(stationLayer);
  }
}
async function stationList(type){
  const key = 'st-' + type, c = await idb.get('kv', key);
  if (c && Date.now() - c.at < 30*864e5) return c.list;
  const r = await fetch(`https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=${type}`);
  if (!r.ok) throw new Error('NOAA station list ' + r.status);
  const j = await r.json();
  let list = (j.stations || []).map(s => ({ id: String(s.id), name: s.name, lat: +s.lat, lng: +s.lng, bin: s.currbin ?? s.bin ?? null, depth: s.depth ?? null }))
    .filter(s => isFinite(s.lat) && isFinite(s.lng));
  if (type === 'currentpredictions'){ // one entry per station: shallowest bin
    const by = new Map();
    for (const s of list){ const o = by.get(s.id); if (!o || (+s.depth || 999) < (+o.depth || 999)) by.set(s.id, s); }
    list = [...by.values()];
  }
  await idb.put('kv', { at: Date.now(), list }, key);
  return list;
}
const nearest = (list, c, n) => list.map(s => ({ s, d: distNm(c, [s.lat, s.lng]) })).sort((a, b) => a.d - b.d).slice(0, n).filter(x => x.d < 25).map(x => x.s);
async function loadNearby(){
  const c = centroid();
  const [t, cu] = await Promise.all([stationList('tidepredictions'), stationList('currentpredictions')]);
  state.nearby = { tide: nearest(t, c, 12), current: nearest(cu, c, 15) };
  return state.nearby;
}
async function useStation(kind, id){
  const pool = state.nearby?.[kind] || [];
  const s = pool.find(x => x.id === id); if (!s) return;
  trip[kind] = s; trip.data = trip.data || {};
  try{
    if (kind === 'tide') trip.data.tide = await fetchTide(s);
    else Object.assign(trip.data, await fetchCurrent(s));
    toast(`${kind === 'tide' ? 'Tides' : 'Currents'}: ${s.name}`);
  }catch(err){ toast('Could not load station: ' + err.message); }
  changed();
}

/* ---------- data fetch ---------- */
async function noaa(p){
  const q = new URLSearchParams({ ...p, begin_date: shiftDay(trip.date,-1).replace(/-/g,''), end_date: shiftDay(trip.date,1).replace(/-/g,''), time_zone: 'gmt', units: 'english', format: 'json', application: 'Outback' });
  const r = await fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?' + q);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || 'NOAA error');
  return j;
}
const gmt = s => Date.parse(s.replace(' ', 'T') + 'Z');
async function fetchTide(s){
  const j = await noaa({ product: 'predictions', datum: 'MLLW', interval: 'hilo', station: s.id });
  return (j.predictions || []).map(p => ({ t: gmt(p.t), v: +p.v, type: p.type }));
}
async function fetchCurrent(s){
  const p = { product: 'currents_predictions', interval: 'MAX_SLACK', station: s.id };
  if (s.bin != null) p.bin = s.bin;
  const j = await noaa(p);
  const cp = j.current_predictions?.cp || [];
  const ev = cp.map(x => {
    const type = String(x.Type || '').toLowerCase(); let v = +x.Velocity_Major || 0;
    if (type === 'ebb') v = -Math.abs(v); else if (type === 'flood') v = Math.abs(v); else if (type === 'slack') v = 0;
    return { t: gmt(x.Time), v, type };
  });
  return { current: ev, floodDir: cp[0]?.meanFloodDir ?? null, ebbDir: cp[0]?.meanEbbDir ?? null };
}
async function fetchWx(c){
  const q = new URLSearchParams({ latitude: c[0].toFixed(4), longitude: c[1].toFixed(4),
    hourly: 'temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl,cape',
    wind_speed_unit: 'kn', temperature_unit: 'fahrenheit', timezone: 'auto', start_date: shiftDay(trip.date,-1), end_date: shiftDay(trip.date,1) });
  const r = await fetch('https://api.open-meteo.com/v1/forecast?' + q);
  const j = await r.json();
  if (j.error) throw new Error(j.reason || 'weather error');
  const h = j.hourly, off = (j.utc_offset_seconds || 0) * 1000;
  return { tz: j.timezone, t: h.time.map(s => Date.parse(s + 'Z') - off), temp: h.temperature_2m, pop: h.precipitation_probability, code: h.weather_code, ws: h.wind_speed_10m, wd: h.wind_direction_10m, wg: h.wind_gusts_10m, p: h.pressure_msl, cape: h.cape };
}
// Elevation profile along the route (Open-Meteo, 90 m DEM), up to 100 samples.
const routeKey = r => r.map(p => p.join(',')).join(';');
async function fetchElev(route){
  const total = routeNm(route); if (route.length < 2 || !total) return null;
  const n = Math.min(100, Math.max(2, Math.ceil(dU(total) * 20) + 1)), pts = [], ds = [];
  let leg = 1, legStart = 0;
  for (let k = 0; k < n; k++){
    const d = total * k / (n - 1);
    while (leg < route.length - 1 && legStart + distNm(route[leg-1], route[leg]) < d){ legStart += distNm(route[leg-1], route[leg]); leg++; }
    const a = route[leg-1], b = route[leg], L0 = distNm(a, b) || 1, f = Math.min(1, Math.max(0, (d - legStart) / L0));
    pts.push([a[0] + (b[0]-a[0]) * f, a[1] + (b[1]-a[1]) * f]); ds.push(d);
  }
  const q = new URLSearchParams({ latitude: pts.map(p => p[0].toFixed(5)).join(','), longitude: pts.map(p => p[1].toFixed(5)).join(',') });
  const r = await fetch('https://api.open-meteo.com/v1/elevation?' + q);
  const j = await r.json();
  if (!Array.isArray(j.elevation)) throw new Error(j.reason || 'no elevation');
  return { key: routeKey(route), d: ds, e: j.elevation.map(m => m * 3.28084) };
}
function elevStats(){
  const el = trip.data?.elev; if (!el || el.key !== routeKey(trip.route)) return null;
  let up = 0, down = 0, hi = -Infinity, lo = Infinity;
  el.e.forEach((v, i) => { hi = Math.max(hi, v); lo = Math.min(lo, v); if (i){ const dv = v - el.e[i-1]; dv > 0 ? up += dv : down -= dv; } });
  return { up, down, hi, lo, start: el.e[0], end: el.e[el.e.length - 1] };
}
// NWS probability of thunder (US only, ~7 days)
function isoDur(d){ const m = /P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/.exec(d || '') || []; return ((+m[1]||0)*24 + (+m[2]||0)) * 36e5 + (+m[3]||0) * 6e4; }
async function fetchThunder(c){
  const r = await fetch(`https://api.weather.gov/points/${c[0].toFixed(4)},${c[1].toFixed(4)}`);
  if (!r.ok) throw new Error('NWS ' + r.status);
  const url = (await r.json()).properties?.forecastGridData;
  if (!url) throw new Error('NWS: no grid');
  const g = await (await fetch(url)).json();
  const vals = g.properties?.probabilityOfThunder?.values;
  if (!vals) throw new Error('NWS: no thunder data');
  return vals.map(v => { const [st, du] = v.validTime.split('/'); const t = Date.parse(st); return { t, end: t + isoDur(du), v: v.value }; });
}
const validTz = z => { try{ return !!z && z !== 'GMT' && !!new Intl.DateTimeFormat('en', { timeZone: z }); }catch{ return false; } };

async function getForecast(){
  if (!navigator.onLine){ toast('You are offline. Connect to get a forecast.'); return; }
  const btn = $('#fcBtn'); btn.disabled = true; btn.textContent = 'Loading…';
  const errs = []; let envMsg = '';
  try{
    const c = centroid();
    if (!trip.envSet || isTidal()){
      try{
        const nb = await loadNearby();
        if (!trip.envSet){
          const near = nb.tide[0] ? distNm(c, [nb.tide[0].lat, nb.tide[0].lng]) : Infinity, was = trip.env;
          trip.env = isHike() ? (near <= 1 ? 'coast' : 'trail') : (near <= 8 ? 'bay' : 'lake');
          if (trip.env !== was) envMsg = isTidal() ? `Tide stations nearby: treating this as ${env().name.toLowerCase()}. ` : `No tide stations nearby: treating this as ${env().name.toLowerCase()}. `;
          if (!isTidal() && settings.layer === 'chart') setLayer('topo');
        }
        if (isTidal()){
          if (!trip.tide || distNm(c, [trip.tide.lat, trip.tide.lng]) > 25) trip.tide = nb.tide[0] || null;
          if (hasCurrents() && (!trip.current || distNm(c, [trip.current.lat, trip.current.lng]) > 25)) trip.current = nb.current[0] || null;
        }
      }catch(e){ if (isTidal()) errs.push('stations'); else if (!trip.envSet) trip.env = isHike() ? 'trail' : 'lake'; }
    }
    const data = trip.data || {};
    const none = () => Promise.reject(new Error('none nearby'));
    const [t, cu, w, th, el] = await Promise.allSettled([
      !isTidal() ? null : trip.tide ? fetchTide(trip.tide) : none(),
      !hasCurrents() ? null : trip.current ? fetchCurrent(trip.current) : none(),
      fetchWx(c),
      fetchThunder(c),
      isHike() && trip.route.length > 1 ? fetchElev(trip.route) : null
    ]);
    if (t.status === 'fulfilled') data.tide = t.value; else { data.tide = null; errs.push('tides (' + t.reason.message + ')'); }
    if (cu.status === 'fulfilled'){ if (cu.value) Object.assign(data, cu.value); else data.current = null; } else { data.current = null; errs.push('currents (' + cu.reason.message + ')'); }
    if (w.status === 'fulfilled'){ data.wx = w.value; if (validTz(w.value.tz) && w.value.tz !== trip.tz){ trip.tz = w.value.tz; if (todayIso() === trip.date) state.tMin = Math.floor(nowMin() / 5) * 5; } }
    else { data.wx = null; errs.push('weather (' + w.reason.message + ')'); }
    data.thunder = th.status === 'fulfilled' ? th.value : null;
    if (el.status === 'fulfilled'){ if (el.value) data.elev = el.value; } else errs.push('elevation (' + el.reason.message + ')');
    trip.data = data; trip.fetchedAt = Date.now();
    changed();
    btn.textContent = 'Saving map…';
    const n = await cacheTiles();
    toast(envMsg + (errs.length ? 'Missing: ' + errs.join(', ') : `Forecast saved. ${n} map tiles stored for offline.`), envMsg ? 6000 : 4500);
  }finally{ btn.disabled = false; btn.textContent = 'Get forecast'; }
}

/* ---------- offline tiles ---------- */
const lon2tile = (lng, n) => Math.floor((lng + 180) / 360 * n);
const lat2tile = (lat, n) => { const r = toR(lat); return Math.floor((1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n); };
function tileUrls(layerKey, b, z0, z1, max = Infinity){
  const L0 = LAYERS[layerKey], urls = [];
  for (let z = z0; z <= z1; z++){
    const n = 2 ** z, x0 = lon2tile(b.getWest(), n), x1 = lon2tile(b.getEast(), n), y0 = lat2tile(b.getNorth(), n), y1 = lat2tile(b.getSouth(), n);
    const count = (x1 - x0 + 1) * (y1 - y0 + 1);
    if (urls.length + count > max) return { urls, capped: true, total: urls.length + count };
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) urls.push(L0.url.replace('{z}', z).replace('{x}', x).replace('{y}', y));
  }
  return { urls, capped: false, total: urls.length };
}
// OpenStreetMap asks bulk downloaders to go slowly: one request at a time with a pause.
async function downloadTiles(urls, { polite, onProgress, signal } = {}){
  const cache = await caches.open('paddle-tiles');
  let done = 0, failed = 0, i = 0;
  const worker = async () => {
    while (i < urls.length && !signal?.aborted){
      const u = urls[i++];
      try{
        if (!(await caches.match(u))){
          let r; try{ r = await fetch(u, { mode: 'cors' }); }catch{ r = await fetch(u, { mode: 'no-cors' }); }
          if (r.ok || r.type === 'opaque') await cache.put(u, r); else failed++;
          if (polite) await new Promise(res => setTimeout(res, 60));
        }
      }catch{ failed++; }
      done++; onProgress?.(done, failed);
    }
  };
  await Promise.all(Array.from({ length: polite ? 1 : 6 }, worker));
  return { done, failed };
}
async function cacheTiles(){

  let b = L.latLngBounds(pts);
  b = L.latLngBounds([b.getSouth() - .03, b.getWest() - .04], [b.getNorth() + .03, b.getEast() + .04]);
  const polite = LAYERS[settings.layer].polite;

  await downloadTiles(urls, { polite, onProgress: d => { if (d % 25 === 0) $('#fcBtn').textContent = `Map ${Math.round(d / urls.length * 100)}%`; } });

/* ---------- interpolation ---------- */
function seg(arr, t){
  if (!arr || arr.length < 2) return null;
  for (let i = 0; i < arr.length - 1; i++) if (t >= arr[i].t && t <= arr[i+1].t) return [arr[i], arr[i+1], (t - arr[i].t) / (arr[i+1].t - arr[i].t)];
  return null;
}
function tideAt(t){
  if (!isTidal()) return null;
  const s = seg(trip.data?.tide, t); if (!s) return null;
  const [a, b, f] = s;
  return { v: (a.v + b.v)/2 + (a.v - b.v)/2 * Math.cos(Math.PI * f), rising: b.v > a.v, next: b };
}
function curAt(t){
  if (!hasCurrents()) return null;
  const s = seg(trip.data?.current, t); if (!s) return null;
  const [a, b, f] = s;
  return { v: a.v + (b.v - a.v) * (1 - Math.cos(Math.PI * f)) / 2, next: b };
}
function wxAt(t){
  const w = trip.data?.wx; if (!w) return null;
  let bi = -1, bd = Infinity;
  w.t.forEach((x, i) => { const d = Math.abs(x - t); if (d < bd){ bd = d; bi = i; } });
  if (bi < 0 || bd > 2*36e5) return null;
  const p = w.p?.[bi], p3 = w.p && bi >= 3 ? w.p[bi - 3] : null;
  return { ws: w.ws[bi], wd: w.wd[bi], wg: w.wg[bi], temp: w.temp[bi], pop: w.pop[bi], code: w.code[bi], p, dp: p != null && p3 != null ? p - p3 : null, cape: w.cape?.[bi] };
}
function thunderAt(t){
  const a = trip.data?.thunder; if (!a) return null;
  const x = a.find(v => t >= v.t && t < v.end); return x ? x.v : null;
}
function stormRisk(w){ // fallback when NWS is unavailable
  if (!w) return null;
  if (w.code >= 95) return { txt: 'Storms', warn: true };
  const cape = w.cape ?? 0, pop = w.pop ?? 0;
  if (cape > 1000 && pop >= 30) return { txt: 'High', warn: true };
  if (cape > 300 && pop >= 20) return { txt: 'Moderate', warn: true };
  return { txt: 'Low', warn: false };
}
function wxText(c){
  if (c == null) return '';
  if (c === 0) return 'Clear'; if (c === 1) return 'Mostly clear'; if (c === 2) return 'Partly cloudy'; if (c === 3) return 'Overcast';
  if (c === 45 || c === 48) return 'Fog'; if (c >= 51 && c <= 57) return 'Drizzle'; if (c >= 61 && c <= 67) return 'Rain';
  if (c >= 71 && c <= 77) return 'Snow'; if (c >= 80 && c <= 82) return 'Showers'; if (c >= 95) return 'Thunderstorm'; return '';
}

function drawCurArrow(dir, sp, flood){
  if (curArrow){ map.removeLayer(curArrow); curArrow = null; }
  if (dir == null || !trip.current || !hasCurrents()) return;
  const len = 22 + Math.min(sp, 5) * 9, col = flood ? '#1F6FB2' : '#2E8B57';
  const html = `<svg width="${len*2}" height="${len*2}" viewBox="${-len} ${-len} ${len*2} ${len*2}" style="transform:rotate(${dir}deg)">
    <line x1="0" y1="${len-6}" x2="0" y2="${-len+10}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>
    <path d="M-9 ${-len+14} L0 ${-len+1} L9 ${-len+14} Z" fill="${col}"/></svg>`;
  curArrow = L.marker([trip.current.lat, trip.current.lng], { interactive: false, icon: L.divIcon({ className: 'arrow', html, iconSize: [len*2, len*2], iconAnchor: [len, len] }) }).addTo(map);
}

/* ---------- day chart ---------- */
const cv = $('#chart');
function drawChart(sun){
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const font = getComputedStyle(document.body).fontFamily, kind = curGraph();
  const note = s => { g.fillStyle = '#5B7183'; g.font = '13px ' + font; g.fillText(s, 8, 22); };
  if (kind === 'elev') return drawElev(g, W, H, font, note);
  const t0 = dayStart(), t1 = t0 + 864e5, X = t => (t - t0) / (t1 - t0) * W;
  // night
  g.fillStyle = 'rgba(18,50,74,.10)';
  if (sun.rise){ g.fillRect(0, 0, X(sun.rise), H); g.fillRect(X(sun.set), 0, W - X(sun.set), H); }
  // hour grid
  g.fillStyle = '#5B7183'; g.font = '10px ' + font;
  for (let h = 3; h < 24; h += 3){ const x = X(t0 + h*36e5); g.fillRect(x, H - 4, 1, 4); g.fillText(h === 12 ? '12p' : (h > 12 ? h - 12 + 'p' : h + 'a'), x + 2, H - 2); }
  const cursor = () => { g.fillStyle = '#C8167E'; g.fillRect(X(tAt()) - 1, 0, 2, H); };
  if (kind === 'wind'){ drawWind(g, W, H, X, t0, t1, font, note); return cursor(); }
  const mid = H * .55;
  if (trip.data?.current && hasCurrents()){
    let mx = 1; for (let x = 0; x <= W; x += 3){ const c = curAt(t0 + x / W * 864e5); if (c) mx = Math.max(mx, Math.abs(c.v)); }
    const sc = (H * .42) / mx;
    for (let x = 0; x <= W; x += 2){
      const c = curAt(t0 + x / W * 864e5); if (!c) continue;
      g.fillStyle = c.v >= 0 ? 'rgba(31,111,178,.55)' : 'rgba(46,139,87,.55)';
      g.fillRect(x, c.v >= 0 ? mid - c.v * sc : mid, 2, Math.abs(c.v) * sc);
    }
    g.fillStyle = 'rgba(18,50,74,.25)'; g.fillRect(0, mid, W, 1);
  }
  if (trip.data?.tide){
    let lo = Infinity, hi = -Infinity;
    for (let x = 0; x <= W; x += 3){ const d = tideAt(t0 + x / W * 864e5); if (d){ lo = Math.min(lo, d.v); hi = Math.max(hi, d.v); } }
    if (isFinite(lo)){
      const Y = v => 8 + (1 - (v - lo) / Math.max(.5, hi - lo)) * (H - 22);
      g.strokeStyle = '#12324A'; g.lineWidth = 2; g.beginPath(); let first = true;
      for (let x = 0; x <= W; x += 2){ const d = tideAt(t0 + x / W * 864e5); if (!d) { first = true; continue; } first ? g.moveTo(x, Y(d.v)) : g.lineTo(x, Y(d.v)); first = false; }
      g.stroke();
    }
  }
  if (!trip.data?.tide && !trip.data?.current) note(`Tide${hasCurrents() ? ' and current' : ''} graph appears after Get forecast`);
  cursor();
}
function drawWind(g, W, H, X, t0, t1, font, note){
  const w = trip.data?.wx;
  if (!w) return note('Wind graph appears after Get forecast');
  const idx = w.t.map((t, i) => i).filter(i => w.t[i] >= t0 - 36e5 && w.t[i] <= t1 + 36e5);
  if (!idx.length) return note('No wind forecast for this day');
  const top = Math.max(settings.gust + 5, ...idx.map(i => w.wg[i] || 0)), Y = v => H - 14 - v / top * (H - 22);
  g.fillStyle = 'rgba(18,50,74,.28)'; g.beginPath(); g.moveTo(X(w.t[idx[0]]), Y(0));
  idx.forEach(i => g.lineTo(X(w.t[i]), Y(w.ws[i]))); g.lineTo(X(w.t[idx[idx.length-1]]), Y(0)); g.fill();
  g.strokeStyle = '#B3261E'; g.lineWidth = 1.5; g.beginPath();
  idx.forEach((i, k) => k ? g.lineTo(X(w.t[i]), Y(w.wg[i])) : g.moveTo(X(w.t[i]), Y(w.wg[i]))); g.stroke();
  g.setLineDash([4, 4]); g.strokeStyle = 'rgba(179,38,30,.6)'; g.beginPath(); g.moveTo(0, Y(settings.gust)); g.lineTo(W, Y(settings.gust)); g.stroke(); g.setLineDash([]);
  g.fillStyle = '#5B7183'; g.font = '10px ' + font; g.fillText(`${Math.round(wU(top))} ${wUnit()}`, 2, 10); g.fillText(`gust limit ${Math.round(wU(settings.gust))}`, W - 76, Y(settings.gust) - 3);
}
function drawElev(g, W, H, font, note){
  const el = trip.data?.elev;
  if (!el || el.key !== routeKey(trip.route)) return note(trip.route.length > 1 ? 'Elevation profile appears after Get forecast' : 'Plot a route to see its elevation profile');
  const lo = Math.min(...el.e), hi = Math.max(...el.e), span = Math.max(50, hi - lo), D = el.d[el.d.length - 1] || 1;
  const X = d => d / D * W, Y = v => 8 + (1 - (v - lo) / span) * (H - 24);
  g.fillStyle = 'rgba(46,139,87,.30)'; g.beginPath(); g.moveTo(0, H - 14);
  el.e.forEach((v, i) => g.lineTo(X(el.d[i]), Y(v))); g.lineTo(W, H - 14); g.fill();
  g.strokeStyle = '#2E8B57'; g.lineWidth = 2; g.beginPath(); el.e.forEach((v, i) => i ? g.lineTo(X(el.d[i]), Y(v)) : g.moveTo(X(el.d[i]), Y(v))); g.stroke();
  g.fillStyle = '#5B7183'; g.font = '10px ' + font;
  g.fillText(ft(hi), 2, 10); g.fillText(ft(lo), 2, H - 16);
  const step = dU(D) > 6 ? 2 : dU(D) > 2 ? 1 : 0.5;
  for (let u = step; u < dU(D); u += step){ const x = X(u / act().k); g.fillRect(x, H - 4, 1, 4); g.fillText(u + ' ' + act().unit, x + 2, H - 2); }

  if (state.going && state.pos){
    let best = 0, bd = Infinity; const r = trip.route; let acc = 0;
    for (let i = 1; i < r.length; i++){ const d = distNm(state.pos, r[i]); acc += distNm(r[i-1], r[i]); if (d < bd){ bd = d; best = acc; } }
    g.fillStyle = '#C8167E'; g.fillRect(X(Math.min(best, D)) - 1, 0, 2, H);
  }
}

/* ---------- location: one GPS watch shared by "show me" and Go ---------- */
function ensureWatch(){
  if (state.watch != null) return true;
  if (!('geolocation' in navigator)){ toast('GPS is not available on this device.'); return false; }
  state.watch = navigator.geolocation.watchPosition(onPos, err => toast('GPS: ' + err.message), { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  return true;
}
function maybeStopWatch(){
  if (state.going || state.locating || state.watch == null) return;
  navigator.geolocation.clearWatch(state.watch); state.watch = null;
}
function setFollow(on){ state.follow = on; locBtnState(); if (on && state.pos) map.setView(state.pos, Math.max(map.getZoom(), 14)); }
function locBtnState(){
  const b = $('#locBtn'); b.classList.toggle('on', state.follow); b.classList.toggle('watch', state.watch != null && !state.follow);

$('#locBtn').onclick = () => {

};

function onPos(p){

  if (state.follow) map.setView(state.pos, Math.max(map.getZoom(), 14), { animate: false });
  locBtnState();

/* ---------- Go: navigate the route and record a track ---------- */
$('#goBtn').onclick = () => state.going ? stopGo() : startGo();

async function startGo(){

function stopGo(){

document.addEventListener('visibilitychange', async () => {

// Keep fixes that are accurate enough and far enough from the last one; save every 20 points.
function record(c, t){
  const k = state.rec; if (!k || c.accuracy > 50) return;
  const p = [+c.latitude.toFixed(6), +c.longitude.toFixed(6), t, c.altitude != null ? Math.round(c.altitude * 3.28084) : null];
  const last = k.pts[k.pts.length - 1];
  if (last && distNm(last, p) * 1852 < Math.max(isHike() ? 5 : 8, c.accuracy / 2)) return;
  k.pts.push(p);
  if (recLine) recLine.addLatLng([p[0], p[1]]); else drawTracks();
  if (k.pts.length - state.recSaved >= 20){ state.recSaved = k.pts.length; trip.updated = Date.now(); saveNow(); }
}
const trackNm = k => routeNm(k.pts);
function trackLabel(k){
  const nm = trackNm(k), h = ((k.end || Date.now()) - k.start) / 36e5;

}
function updateNav(){
  if (!state.going) return;
  const r = trip.route, k = state.rec, routed = r.length > 1;
  const sogU = state.sog != null ? (isHike() ? state.sog * 1.15078 : state.sog) : null;
  $('#navSogK').textContent = `Speed ${act().spd}`;
  $('#navSog').textContent = sogU != null ? sogU.toFixed(1) : '–';
  const recTxt = k ? `<span class="rec">● REC</span> ${esc(trackLabel(k))}` : '';
  if (!routed){ // record-only
    $('#navTo').textContent = 'Track'; $('#navDist').textContent = k ? fmtD(trackNm(k), 2) : '–';
    $('#navBrgK').textContent = 'Time'; $('#navBrg').textContent = k ? fmtDur((Date.now() - k.start) / 36e5) : '–';
    $('#navEtaK').textContent = 'Points'; $('#navEta').textContent = k ? k.pts.length : '–';
    $('#navLeft').innerHTML = state.pos ? recTxt : 'Waiting for GPS…';
    return;
  }
  $('#navTo').textContent = `To ${state.next + 1}`; $('#navBrgK').textContent = 'Bearing'; $('#navEtaK').textContent = 'Finish';
  if (!state.pos){ $('#navDist').textContent = '–'; $('#navBrg').textContent = '–'; $('#navEta').textContent = '–'; $('#navLeft').textContent = 'Waiting for GPS…'; return; }
  const tgt = r[state.next], d = distNm(state.pos, tgt);
  let rest = d; for (let i = state.next + 1; i < r.length; i++) rest += distNm(r[i-1], r[i]);
  const spdU = sogU != null && sogU > 0.5 ? sogU : speed();
  $('#navDist').textContent = fmtNear(d);
  $('#navBrg').textContent = magB(brgT(state.pos, tgt)).replace('°M', '°');
  $('#navEta').textContent = hm(Date.now() + dU(rest) / spdU * 36e5);
  const arrived = state.next === r.length - 1 && d < act().arrive;
  $('#navLeft').innerHTML = arrived ? `Arrived · ${recTxt}` : `${fmtD(rest, 2)} to go · ${recTxt}`;
}

const shownMaps = new Map(); // id -> { layer, url }
let affine; // { fitAffine, applyAffine } from pdfmap.js
const loadPdfMod = async () => affine || (affine = await import('./pdfmap.js'));
function opBarState(){ $('#opBar').hidden = !(shownMaps.size || state.nudge); }
$('#opacity').addEventListener('input', e => {

function showTrailMap(m, on, focus){
  if (on && !shownMaps.has(m.id)){
    const url = URL.createObjectURL(m.imageBlob);
    const layer = L.imageOverlay.rotated(url, L.latLng(m.topLeft), L.latLng(m.topRight), L.latLng(m.bottomLeft), { opacity: +$('#opacity').value, interactive: false }).addTo(map);

function edgePoints(tl, tr, bl, w, h){
  const at = (fx, fy) => [tl[0] + fx * (tr[0] - tl[0]) + fy * (bl[0] - tl[0]), tl[1] + fx * (tr[1] - tl[1]) + fy * (bl[1] - tl[1])];
  const pt = (fx, fy, name) => { const [lat, lon] = at(fx, fy); return { px: fx * w, py: fy * h, lat, lon, name }; };
  return [pt(.5, .08, 'Top edge'), pt(.92, .5, 'Right edge'), pt(.5, .92, 'Bottom edge'), pt(.08, .5, 'Left edge')];
}
$('#pdfFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  toast('Reading PDF…', 30000);
  try{
    const mod = await loadPdfMod();
    const res = await Promise.race([mod.parseGeoPdf(f), new Promise((_, rej) => setTimeout(() => rej(new Error('Timed out. The PDF may be too large.')), 60000))]);
    const name = (prompt('Name this trail map', f.name.replace(/\.pdf$/i, '')) || '').trim() || f.name;
    let { topLeft: tl, topRight: tr, bottomLeft: bl } = res;
    if (!tl){ const b = map.getBounds().pad(-0.15); tl = [b.getNorth(), b.getWest()]; tr = [b.getNorth(), b.getEast()]; bl = [b.getSouth(), b.getWest()]; }
    const m = { id: uid(), name, imageBlob: res.imageBlob, imageWidth: res.imageWidth, imageHeight: res.imageHeight, topLeft: tl, topRight: tr, bottomLeft: bl,
      controlPoints: edgePoints(tl, tr, bl, res.imageWidth, res.imageHeight), method: res.method, detectedLabels: res.labels || [], createdAt: Date.now() };
    toast(res.labels?.length ? `Found ${res.labels.length} GPS labels (${res.labels.join(', ')}). Check the placement.` : res.method === 'manual placement' ? 'No position data in this PDF. Drag the points into place.' : 'Placed from the PDF\'s map data. Check it.', 6000);
    startNudge(m, true);
  }catch(err){ toast('PDF import failed: ' + err.message, 5000); }
};
async function startNudge(m, isNew){
  const { fitAffine, applyAffine } = await loadPdfMod();
  setDrawing(false); sheet.close?.();
  if (!isNew) showTrailMap(m, false);
  const url = URL.createObjectURL(m.imageBlob);
  const layer = L.imageOverlay.rotated(url, L.latLng(m.topLeft), L.latLng(m.topRight), L.latLng(m.bottomLeft), { opacity: Math.max(+$('#opacity').value, .7), interactive: false }).addTo(map);
  const pts = (m.controlPoints?.length === 4 ? m.controlPoints : edgePoints(m.topLeft, m.topRight, m.bottomLeft, m.imageWidth, m.imageHeight)).map(p => ({ ...p }));
  const W = m.imageWidth, H = m.imageHeight, handles = L.layerGroup().addTo(map);
  const fit = () => { const a = fitAffine(pts, 'lat'), b = fitAffine(pts, 'lon');
    const r = { topLeft: applyAffine(a, b, 0, 0), topRight: applyAffine(a, b, W, 0), bottomLeft: applyAffine(a, b, 0, H), a, b };
    layer.reposition(L.latLng(r.topLeft), L.latLng(r.topRight), L.latLng(r.bottomLeft)); return r; };
  const centre = () => L.latLng(pts.reduce((s, p) => s + p.lat, 0) / 4, pts.reduce((s, p) => s + p.lon, 0) / 4);
  const marks = pts.map(p => L.marker([p.lat, p.lon], { draggable: true, icon: L.divIcon({ className: '', html: '<div class="nudge"></div>', iconSize: [22,22], iconAnchor: [11,11] }) }).bindTooltip(p.name, { direction: 'top', offset: [0, -12] }).addTo(handles));
  const cm = L.marker(centre(), { draggable: true, icon: L.divIcon({ className: '', html: '<div class="nudge-c">✥</div>', iconSize: [34,34], iconAnchor: [17,17] }) }).addTo(handles);
  let prev = cm.getLatLng();
  // Drag one point: refit and snap the others to where the fit puts them. Drag the centre: move everything.
  marks.forEach((mk, i) => mk.on('drag', () => {
    const ll = mk.getLatLng(); pts[i].lat = ll.lat; pts[i].lon = ll.lng;
    const { a, b } = fit();
    pts.forEach((p, j) => { if (j === i) return; [p.lat, p.lon] = applyAffine(a, b, p.px, p.py); marks[j].setLatLng([p.lat, p.lon]); });
    prev = centre(); cm.setLatLng(prev);
  }));
  cm.on('drag', () => { const c = cm.getLatLng(), dLat = c.lat - prev.lat, dLon = c.lng - prev.lng; prev = c;
    pts.forEach((p, i) => { p.lat += dLat; p.lon += dLon; marks[i].setLatLng([p.lat, p.lon]); }); fit(); });
  const end = () => { map.removeLayer(handles); map.removeLayer(layer); URL.revokeObjectURL(url); state.nudge = null; endMapBar(); opBarState(); };
  state.nudge = { layer };
  showMapBar(`<span class="txt">Drag the 4 points onto matching spots, or ✥ to move it all.</span><button class="btn" id="nCancel">Cancel</button><button class="btn" id="nSave">Save</button>`, end);
  opBarState(); $('#panel').classList.add('min');
  $('#nCancel').onclick = () => { end(); if (!isNew) showTrailMap(m, true); };
  $('#nSave').onclick = async () => {
    const r = fit();
    Object.assign(m, { topLeft: r.topLeft, topRight: r.topRight, bottomLeft: r.bottomLeft, controlPoints: pts.map(p => ({ ...p })) });
    if (!isNew && !/adjusted/.test(m.method)) m.method += ', adjusted';
    end(); await idb.put('trailMaps', m); showTrailMap(m, true); toast('Trail map saved. Find it under ☰ › Offline maps.');
  };

}

// The GPS Map app lives on the same origin (hodzic.github.io), so its saved areas and trail maps can be copied over.
async function gpsMapDb(){
  try{ if (!(await indexedDB.databases?.())?.some(d => d.name === 'gpsmapdb3')) return null; }catch{ return null; }
  return new Promise(res => { const r = indexedDB.open('gpsmapdb3'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onupgradeneeded = () => { r.transaction.abort(); res(null); }; });
}
async function importGpsMap(){
  const d = await gpsMapDb(); if (!d) return toast('No GPS Map data found.');

  const [regions, maps] = await Promise.all([all('regions'), all('trailMaps')]); d.close();

}

      try{ await loadNearby(); toast('Tap a faded T or C marker to use that station.'); }
      catch{ state.showStations = false; toast('Station list needs a connection.'); }
    }
    return drawStations();
  }
  if (id === 'mTracks') return tracksSheet();
  if (ds.trackroute){
    const k = trip.tracks.find(x => x.id === ds.trackroute); if (!k) return;
    let tol = 0.002, r = simplify(k.pts.map(p => [p[0], p[1]]), tol);
    while (r.length > 60) r = simplify(k.pts.map(p => [p[0], p[1]]), tol *= 1.6);
    trip.route = r; sheet.close(); changed(); toast(`Route made from track: ${r.length} waypoints.`); return;
  }
  if (ds.rmtrack){ if (!confirm('Delete this track?')) return; trip.tracks = trip.tracks.filter(x => x.id !== ds.rmtrack); changed(); return tracksSheet(); }
  if (ds.showtrack){ const k = trip.tracks.find(x => x.id === ds.showtrack); sheet.close(); if (k?.pts.length) map.fitBounds(L.latLngBounds(k.pts.map(p => [p[0], p[1]])), { paddingBottomRight: [30, 200] }); return; }
  if (id === 'mBack'){ sheet.close(); trip.route = trip.route.concat(trip.route.slice(0, -1).reverse()); changed(); toast('Return legs added: you finish where you started.'); return; }
  if (id === 'mReverse'){ sheet.close(); trip.route.reverse(); changed(); toast('Route reversed.'); return; }
  if (id === 'mOffline') return offlineSheet();
  if (id === 'oArea'){ sheet.close(); return saveAreaBar(); }
  if (id === 'oPdf'){ sheet.close(); return $('#pdfFile').click(); }
  if (id === 'oGps') return importGpsMap();
  if (ds.region){
    const r = await idb.get('regions', ds.region); sheet.close(); if (!r) return;
    if (r.layer in LAYERS && r.layer !== settings.layer) setLayer(r.layer);
    map.fitBounds([[r.bounds.s, r.bounds.w], [r.bounds.n, r.bounds.e]]); return;
  }
  if (ds.rmregion){ if (!confirm('Delete this map area?')) return; await idb.del('regions', ds.rmregion); return offlineSheet(); }
  if (ds.tmap){ const m = await idb.get('trailMaps', ds.tmap); const on = !shownMaps.has(ds.tmap); showTrailMap(m, on, on); if (on) sheet.close(); else offlineSheet(); return; }
  if (ds.adjust){ const m = await idb.get('trailMaps', ds.adjust); sheet.close(); return startNudge(m, false); }
  if (ds.rmtmap){ if (!confirm('Delete this trail map?')) return; showTrailMap({ id: ds.rmtmap }, false); await idb.del('trailMaps', ds.rmtmap); return offlineSheet(); }
  if (id === 'mJson'){ sheet.close(); return shareFile(fileName('json'), JSON.stringify({ app: 'Outback', version: 2, trip }, null, 1), 'application/json'); }
  if (id === 'mGpx'){ sheet.close(); if (trip.route.length < 1 && !trip.tracks.length) return toast('No route or track to export.'); return shareFile(fileName('gpx'), toGpx(), 'application/gpx+xml'); }
  if (id === 'mImport'){ sheet.close(); return $('#file').click(); }
  if (id === 'mSettings') return settingsSheet();
  if (id === 'mAbout') return openSheet(`<h2>Outback</h2>
    <p>Plan an out-and-back paddle or hike online, then take it offline. Tides and currents: NOAA CO-OPS. Wind, weather, pressure and elevation: Open-Meteo. Lightning: NWS thunder probability (US), otherwise estimated from rain chance and atmospheric instability. Maps: NOAA charts, OpenStreetMap or USGS topo, plus your own PDF trail maps (read on the phone with MuPDF). Sun times are calculated on the phone.</p>
    <p>Tide and current curves are smoothed between NOAA high/low and slack/max predictions. Current directions are mean flood and ebb directions in degrees true. Hiking times add 1 hour per 2000 ft of climb.</p>
    <p>Tracks are recorded while Go is on and the screen is awake.</p>
    <p class="danger"><b>Not for navigation.</b> Check official forecasts and conditions before you set out.</p>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
  if (ds.open){ const t = await idb.get('trips', ds.open); sheet.close(); return openTrip(t); }
  if (ds.rm){
    const rid = ds.rm;
    if (!confirm('Delete this trip?')) return;
    await idb.del('trips', rid);
    if (rid === trip.id){ const t = newTrip(trip.activity); await idb.put('trips', t); await openTrip(t); }
    return tripsSheet();
  }
  if (id === 'sSave'){
    const sp = +$('#sSpeed').value, va = $('#sVar').value, gu = +$('#sGust').value;
    if (sp > 0) settings.speeds[trip.activity] = sp;
    if (va.trim() !== '' && isFinite(+va)) settings.variation = +va;
    if (gu > 0) settings.gust = isHike() ? gu / 1.15078 : gu;
    saveSettings(); sheet.close(); changed(); toast('Settings saved');
  }
});
async function tripsSheet(){
  const all = (await idb.all('trips')).map(normTrip).sort((a, b) => b.date.localeCompare(a.date) || b.updated - a.updated);
  openSheet(`<h2>My trips</h2><div class="list">${all.map(t => `<div class="item">
      <div class="grow"><b>${esc(t.name)}</b><small>${esc(ACT[t.activity]?.name || '')} · ${esc(t.date)} · ${(routeNm(t.route) * (ACT[t.activity]?.k || 1)).toFixed(1)} ${ACT[t.activity]?.unit || 'nm'}${t.tracks.length ? ` · ${t.tracks.length} track${t.tracks.length > 1 ? 's' : ''}` : ''}${t.fetchedAt ? ' · forecast saved' : ''}</small></div>
      <button class="btn" data-open="${esc(t.id)}">Open</button><button class="btn" data-rm="${esc(t.id)}" aria-label="Delete ${esc(t.name)}">✕</button></div>`).join('') || '<p>No trips yet.</p>'}</div>
    <div class="row"><button class="btn" id="mNew">New trip</button><button class="btn" data-close>Close</button></div>`);
}
function tracksSheet(){
  const ks = trip.tracks.slice().reverse();
  openSheet(`<h2>Recorded tracks</h2><p><small>Tap Go to record. Tracks are saved with this trip and exported in the GPX.</small></p>
    <div class="list">${ks.map(k => `<div class="item"><div class="grow"><b>${new Date(k.start).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: tz() })}</b>
      <small>${esc(trackLabel(k))} · ${k.pts.length} points</small></div>
      <button class="btn" data-showtrack="${k.id}">Show</button><button class="btn" data-trackroute="${k.id}">Use as route</button><button class="btn" data-rmtrack="${k.id}" aria-label="Delete track">✕</button></div>`).join('') || '<p>No tracks yet.</p>'}</div>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
}
function settingsSheet(){
  openSheet(`<h2>Settings</h2>
    <label for="sSpeed">${act().name} speed (${act().spd})</label><input id="sSpeed" type="number" step="0.1" min="0.5" value="${speed()}">
    <label for="sVar">Magnetic variation (° east)</label><input id="sVar" type="number" step="0.5" value="${settings.variation}">
    <p><small>SF Bay is about 13° E. Bearings are shown magnetic (°M).</small></p>
    <label for="sGust">Gust warning (${wUnit()})</label><input id="sGust" type="number" step="1" min="1" value="${Math.round(wU(settings.gust))}">
    <div class="row"><button class="btn" data-close>Cancel</button><button class="btn" id="sSave">Save</button></div>`);
}
function routeSheet(){
  const r = trip.route; if (r.length < 2) return toast('Tap Draw and add at least 2 waypoints.');
  let cum = 0, start = tAt();
  const rows = r.map((p, i) => {
    if (!i) return `<tr><td>1</td><td>–</td><td>–</td><td>0.00</td><td>${hm(start)}</td></tr>`;
    const d = distNm(r[i-1], p); cum += d;
    return `<tr><td>${i+1}</td><td>${dU(d).toFixed(2)}</td><td>${magB(brgT(r[i-1], p))}</td><td>${dU(cum).toFixed(2)}</td><td>${hm(start + hoursFor(cum) * 36e5)}</td></tr>`;
  }).join('');
  const es = elevStats();
  openSheet(`<h2>Route</h2><p><small>Times assume departure at ${hm(start)} (the time slider) and ${speed()} ${act().spd}${isHike() ? ', on the flat' : ', without current'}.${es ? ` Total climb ${ft(es.up)} adds about ${fmtDur(es.up / 2000)}.` : ''}</small></p>
    <table><tr><th>WP</th><th>Leg ${act().unit}</th><th>Bearing</th><th>Total ${act().unit}</th><th>Arrive</th></tr>${rows}</table>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
}

/* ---------- export / import ---------- */
const fileName = ext => `${String(trip.name || '').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'trip'}_${trip.date}.${ext}`;
function toGpx(){
  const pts = trip.route.map((p, i) => `  <rtept lat="${p[0]}" lon="${p[1]}"><name>WP${i+1}</name></rtept>`).join('\n');
  const trks = trip.tracks.filter(k => k.pts.length > 1).map(k => ` <trk><name>${esc(trip.name)} ${new Date(k.start).toISOString().slice(0, 16).replace('T', ' ')}</name><trkseg>\n${k.pts.map(p =>
    `  <trkpt lat="${p[0]}" lon="${p[1]}">${p[3] != null ? `<ele>${(p[3] / 3.28084).toFixed(1)}</ele>` : ''}<time>${new Date(p[2]).toISOString()}</time></trkpt>`).join('\n')}\n </trkseg></trk>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Outback" xmlns="http://www.topografix.com/GPX/1/1">\n${trip.route.length ? ` <rte><name>${esc(trip.name)}</name>\n${pts}\n </rte>\n` : ''}${trks}\n</gpx>\n`;
}
async function shareFile(name, text, type){
  const file = new File([text], name, { type });
  try{ if (navigator.canShare?.({ files: [file] })){ await navigator.share({ files: [file], title: name }); return; } }catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const text = await f.text();
  try{
    let t;
    if (/\.gpx$/i.test(f.name) || text.trimStart().startsWith('<')){
      const x = new DOMParser().parseFromString(text, 'application/xml');
      const ll = p => [+(+p.getAttribute('lat')).toFixed(6), +(+p.getAttribute('lon')).toFixed(6)];
      const rte = [...x.getElementsByTagName('rtept')], trk = [...x.getElementsByTagName('trkpt')], wpt = [...x.getElementsByTagName('wpt')];
      t = newTrip(trip?.activity || 'paddle');
      t.name = x.querySelector('rte>name,trk>name,metadata>name')?.textContent?.trim() || f.name.replace(/\.gpx$/i, '');
      // A timed track is kept as a recorded track; the route comes from route points, else a simplified track.
      const timed = trk.filter(p => p.getElementsByTagName('time')[0]);
      if (timed.length > 1){
        const pts = timed.map(p => { const e = p.getElementsByTagName('ele')[0]; return [...ll(p), Date.parse(p.getElementsByTagName('time')[0].textContent), e ? Math.round(+e.textContent * 3.28084) : null]; });
        t.tracks.push({ id: uid(), start: pts[0][2], end: pts[pts.length - 1][2], pts });
        t.date = new Date(pts[0][2]).toISOString().slice(0, 10);
      }
      let pts = rte.length ? rte.map(ll) : trk.length ? trk.map(ll) : wpt.map(ll);
      if (!pts.length) throw new Error('No points found in GPX');
      if (!rte.length && pts.length > 60){ let tol = 0.002; let s = simplify(pts, tol); while (s.length > 60) s = simplify(pts, tol *= 1.6); pts = s; }
      t.route = pts;
    } else {
      const j = JSON.parse(text); t = j.trip || j;
      if (!Array.isArray(t.route) || !t.date) throw new Error('Not an Outback trip file');
      t.name = String(t.name || f.name.replace(/\.json$/i, ''));
      t.id = t.id || newTrip().id;
      if (await idb.get('trips', t.id)) t.id = newTrip().id;
    }
    t.updated = Date.now();
    await idb.put('trips', t); await openTrip(t); toast('Imported ' + t.name);
  }catch(err){ toast('Import failed: ' + err.message, 4000); }
};

/* ---------- start ---------- */
(async () => {
  let t = null; const last = LS.get('lastTrip');
  try{ if (last) t = await idb.get('trips', last); }catch{}
  if (!t){ t = newTrip(); try{ await idb.put('trips', t); }catch{} }
  await openTrip(t);
  if (todayIso() === trip.date) setNow();
  else render();
  for (const id of settings.shownMaps || []){ try{ const m = await idb.get('trailMaps', id); if (m) showTrailMap(m, true); }catch{} }
})();
addEventListener('resize', () => { if (trip) render(); });
addEventListener('offline', () => toast('Offline. Saved trips and maps still work.'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
