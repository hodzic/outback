<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12324A">
<title>Paddle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --ink:#12324A; --muted:#5B7183; --line:#D5DEE6; --paper:#FFFFFF; --wash:#EEF3F7;
  --magenta:#C8167E; --flood:#1F6FB2; --ebb:#2E8B57; --land:#F3E2A9; --warn:#B3261E;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--wash);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
#map{position:fixed;inset:0;background:#cfe3ee}
.leaflet-control-attribution{font-size:10px}

/* top bar */
#top{position:fixed;left:0;right:0;top:0;z-index:1000;display:flex;gap:6px;align-items:center;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 0 8px;pointer-events:none}
#top>*{pointer-events:auto}
.pill{background:var(--paper);border:1px solid var(--line);border-radius:22px;height:40px;padding:0 14px;
  box-shadow:0 1px 3px rgba(18,50,74,.18);font-size:15px}
.pill.icon{width:40px;padding:0;font-size:20px}
#tripBtn{font-weight:700;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#date{padding:0 10px;min-width:0;width:140px}
.grow{flex:1}

/* nav strip (paddle mode) */
#nav{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:1000;
  background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;display:grid;
  grid-template-columns:repeat(4,1fr);gap:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#nav[hidden]{display:none}
#nav .k{font-size:12px;opacity:.75}
#nav .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
#nav .wide{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:14px}
#nav button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:16px;padding:4px 12px}

/* bottom panel */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--paper);
  border-radius:16px 16px 0 0;box-shadow:0 -2px 10px rgba(18,50,74,.18);
  padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
#handle{display:block;width:100%;height:18px;border:0;background:none;padding:0}
#handle::after{content:"";display:block;margin:4px auto;width:44px;height:5px;border-radius:3px;background:var(--line)}
#panel.min .full{display:none}
#routeBtn{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:2px 0 6px;text-align:left}
#dist{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
#legs{color:var(--muted);font-size:14px}
#chart{display:block;width:100%;height:96px;touch-action:none}
.slider{display:flex;align-items:center;gap:8px;margin:2px 0 6px}
.slider input{flex:1;accent-color:var(--magenta)}
#timeOut{font-weight:700;font-variant-numeric:tabular-nums;min-width:72px;text-align:right}
.btn{background:var(--wash);border:1px solid var(--line);border-radius:10px;height:40px;padding:0 12px;font-size:15px}
.read{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.cell{padding:7px 4px 7px 0;border-bottom:1px solid var(--line);min-width:0}
.cell:nth-child(odd){border-right:1px solid var(--line)}
.cell:nth-child(even){padding-left:10px}
.cell .k{font-size:12px;color:var(--muted)}
.cell .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v.flood{color:var(--flood)} .v.ebb{color:var(--ebb)}
#status{margin:6px 0 4px;font-size:13px;color:var(--muted);min-height:1em}
#status.warn{color:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1.4fr 1fr 48px;gap:8px}
.actions button{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:16px;font-weight:700}
.actions .primary{background:var(--magenta);border-color:var(--magenta);color:#fff}
.actions .on{background:var(--ink);border-color:var(--ink);color:#fff}

/* draw hint */
#drawBar{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:1000;
  background:var(--paper);border:2px solid var(--magenta);border-radius:14px;padding:8px 10px;display:flex;gap:8px;align-items:center}
#drawBar[hidden]{display:none}
#drawBar span{flex:1;font-size:15px}

/* map markers */
.wp{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--magenta);
  font:700 12px/20px var(--font);text-align:center;color:var(--magenta)}
.wp.next{background:var(--magenta);color:#fff}
.leg{background:rgba(255,255,255,.92);border:1px solid var(--magenta);color:var(--magenta);font:700 12px var(--font);
  padding:1px 5px;border-radius:6px;box-shadow:none}
.leg::before{display:none}
.st{width:22px;height:22px;border-radius:4px;background:#fff;border:2px solid var(--ink);font:700 11px/18px var(--font);text-align:center}
.st.tide{border-color:var(--ink)} .st.cur{border-color:var(--flood);transform:rotate(45deg)}
.st.cur span{display:inline-block;transform:rotate(-45deg)}
.st.dim{opacity:.6;transform:scale(.8)} .st.cur.dim{transform:rotate(45deg) scale(.8)}
.arrow svg{filter:drop-shadow(0 0 2px #fff)}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 2px rgba(26,115,232,.35)}

/* sheet */
dialog{border:0;border-radius:16px;padding:0;width:min(520px,94vw);max-height:84vh;color:var(--ink)}
dialog::backdrop{background:rgba(18,50,74,.4)}
.sh{padding:16px}
.sh h2{margin:0 0 10px;font-size:20px}
.sh .list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.sh .item{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.sh .item .grow{min-width:0}
.sh .item small{display:block;color:var(--muted)}
.sh .menu button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 4px;font-size:16px}
.sh label{display:block;margin:10px 0 4px;font-weight:700}
.sh input[type=number],.sh input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px}
.sh .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.sh table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.sh td,.sh th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.sh td:first-child,.sh th:first-child{text-align:left}
.sh p{line-height:1.45}
.danger{color:var(--warn)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:3000;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px}
</style>
</head>
<body>
<div id="map"></div>

<header id="top">
  <button id="tripBtn" class="pill">New trip</button>
  <input id="date" class="pill" type="date" aria-label="Trip date">
  <span class="grow"></span>
  <button id="layerBtn" class="pill">Chart</button>
  <button id="locBtn" class="pill icon" aria-label="Show my location">◎</button>
</header>

<div id="drawBar" hidden>
  <span>Tap the map to add waypoints. Drag to move.</span>
  <button id="undoBtn" class="btn">Undo</button>
  <button id="doneBtn" class="btn">Done</button>
</div>

<div id="nav" hidden>
  <div><div class="k" id="navTo">To 2</div><div class="v" id="navDist">–</div></div>
  <div><div class="k">Bearing</div><div class="v" id="navBrg">–</div></div>
  <div><div class="k">Speed</div><div class="v" id="navSog">–</div></div>
  <div><div class="k">Finish</div><div class="v" id="navEta">–</div></div>
  <div class="wide"><span id="navLeft">–</span><button id="stopBtn">Stop</button></div>
</div>

<section id="panel">
  <button id="handle" aria-label="Expand or collapse panel"></button>
  <div class="full">
    <button id="routeBtn"><span id="dist">0.0 nm</span><span id="legs">Tap Draw to plot a route</span></button>
    <canvas id="chart" aria-label="Tide and current graph for the trip day"></canvas>
    <div class="slider">
      <input id="time" type="range" min="0" max="1435" step="5" aria-label="Time of day">
      <output id="timeOut"></output>
      <button id="nowBtn" class="btn">Now</button>
    </div>
  </div>
  <div class="read">
    <div class="cell"><div class="k" id="tideK">Tide</div><div class="v" id="tideV">–</div><div class="s" id="tideS">&nbsp;</div></div>
    <div class="cell"><div class="k" id="curK">Current</div><div class="v" id="curV">–</div><div class="s" id="curS">&nbsp;</div></div>
    <div class="cell"><div class="k">Wind</div><div class="v" id="windV">–</div><div class="s" id="windS">&nbsp;</div></div>
    <div class="cell"><div class="k">Sun</div><div class="v" id="sunV">–</div><div class="s" id="sunS">&nbsp;</div></div>
  </div>
  <p id="status"></p>
  <div class="actions">
    <button id="drawBtn">Draw</button>
    <button id="fcBtn" class="primary">Get forecast</button>
    <button id="goBtn">Paddle</button>
    <button id="menuBtn" aria-label="Menu">☰</button>
  </div>
</section>

<dialog id="sheet"></dialog>
<div id="toast" role="status"></div>
<input id="file" type="file" accept=".json,.gpx,application/json,application/gpx+xml" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* ---------- basics ---------- */
const $ = s => document.querySelector(s);
const LS = {
  get(k, d){ try{ const v = localStorage.getItem('paddle.'+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem('paddle.'+k, JSON.stringify(v)); }catch{} }
};
const settings = Object.assign({ speed: 3, variation: 13, layer: 'chart' }, LS.get('settings', {}));
const saveSettings = () => LS.set('settings', settings);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let toastT;
function toast(msg, ms = 2800){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }

/* ---------- IndexedDB ---------- */
let dbp;
function db(){
  return dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('paddle', 1);
    r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('trips', { keyPath: 'id' }); d.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error);
  });
}
const idb = {
  get: (st, k) => tx(st, 'readonly', s => s.get(k)),
  put: (st, v, k) => tx(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)),
  del: (st, k) => tx(st, 'readwrite', s => s.delete(k)),
  all: st => tx(st, 'readonly', s => s.getAll())
};

/* ---------- geo + time helpers ---------- */
const toR = d => d * Math.PI / 180, toD = r => r * 180 / Math.PI;
function distNm(a, b){
  const dLat = toR(b[0]-a[0]), dLng = toR(b[1]-a[1]);
  const h = Math.sin(dLat/2)**2 + Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2 * 3440.065 * Math.asin(Math.sqrt(h));
}
function brgT(a, b){
  const y = Math.sin(toR(b[1]-a[1])) * Math.cos(toR(b[0]));
  const x = Math.cos(toR(a[0]))*Math.sin(toR(b[0])) - Math.sin(toR(a[0]))*Math.cos(toR(b[0]))*Math.cos(toR(b[1]-a[1]));
  return (toD(Math.atan2(y, x)) + 360) % 360;
}
const d3 = n => String(Math.round(((n % 360) + 360) % 360)).padStart(3, '0');
const magB = t => d3(t - settings.variation) + '°M';
const COMPASS = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
const compass = d => COMPASS[Math.round(((d % 360) + 360) % 360 / 22.5) % 16];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const shiftDay = (iso, n) => { const d = new Date(iso+'T12:00'); d.setDate(d.getDate()+n); return ymd(d); };
const hm = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
const dayStart = () => new Date(trip.date + 'T00:00').getTime();
const tAt = () => dayStart() + state.tMin * 6e4;
const routeNm = r => r.reduce((s, p, i) => i ? s + distNm(r[i-1], p) : 0, 0);
function centroid(){
  if (trip.route.length){ const n = trip.route.length; return [trip.route.reduce((s,p)=>s+p[0],0)/n, trip.route.reduce((s,p)=>s+p[1],0)/n]; }
  const c = map.getCenter(); return [c.lat, c.lng];
}

/* ---------- sun (after SunCalc, V. Agafonkin, BSD) ---------- */
function sunTimes(dateIso, lat, lng){
  const rad = Math.PI/180, dayMs = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad*23.4397, J0 = 0.0009;
  const date = new Date(dateIso+'T12:00').getTime();
  const d = date/dayMs - 0.5 + J1970 - J2000;
  const lw = rad * -lng, phi = rad * lat;
  const n = Math.round(d - J0 - lw/(2*Math.PI));
  const approx = (Ht) => J0 + (Ht + lw)/(2*Math.PI) + n;
  const ds = approx(0);
  const M = rad*(357.5291 + 0.98560028*ds);
  const L = M + rad*(1.9148*Math.sin(M) + 0.02*Math.sin(2*M) + 0.0003*Math.sin(3*M)) + rad*102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const transit = (x) => J2000 + x + 0.0053*Math.sin(M) - 0.0069*Math.sin(2*L);
  const Jnoon = transit(ds);
  const fromJ = j => (j + 0.5 - J1970) * dayMs;
  const pair = (h) => {
    const w = Math.acos((Math.sin(h*rad) - Math.sin(phi)*Math.sin(dec)) / (Math.cos(phi)*Math.cos(dec)));
    if (isNaN(w)) return [null, null];
    const Jset = transit(approx(w)); return [fromJ(Jnoon - (Jset - Jnoon)), fromJ(Jset)];
  };
  const [rise, set] = pair(-0.833), [dawn, dusk] = pair(-6);
  return { rise, set, dawn, dusk };
}

/* ---------- state ---------- */
const state = { tMin: 600, drawing: false, paddling: false, next: 1, pos: null, sog: null, watch: null, wake: null, follow: false, showStations: false };
let trip;
function newTrip(){
  return { id: 't' + Date.now().toString(36), name: 'New trip', date: ymd(new Date()), route: [], tide: null, current: null, data: null, fetchedAt: null, updated: Date.now() };
}

/* ---------- map ---------- */
const view = LS.get('view', { c: [37.82, -122.38], z: 11 });
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView(view.c, view.z);
map.on('moveend', () => LS.set('view', { c: [map.getCenter().lat, map.getCenter().lng], z: map.getZoom() }));
const LAYERS = {
  chart: { name: 'Chart', url: 'https://gis.charttools.noaa.gov/arcgis/rest/services/MarineChart_Services/NOAACharts/MapServer/tile/{z}/{y}/{x}', opt: { maxZoom: 18, maxNativeZoom: 16, attribution: 'NOAA charts · not for navigation' } },
  street: { name: 'Street', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt: { maxZoom: 19, attribution: '© OpenStreetMap contributors' } }
};
let base, tileErr = 0, tileOk = 0;
function setLayer(k){
  if (base) map.removeLayer(base);
  settings.layer = k; saveSettings(); tileErr = 0; tileOk = 0;
  base = L.tileLayer(LAYERS[k].url, LAYERS[k].opt).addTo(map);
  base.on('tileload', () => tileOk++);
  base.on('tileerror', () => { if (++tileErr > 12 && tileOk === 0 && k === 'chart' && navigator.onLine){ toast('Chart tiles are not loading. Switched to Street.'); setLayer('street'); } });
  $('#layerBtn').textContent = LAYERS[k].name;
}
setLayer(settings.layer in LAYERS ? settings.layer : 'chart');
$('#layerBtn').onclick = () => setLayer(settings.layer === 'chart' ? 'street' : 'chart');

const routeLayer = L.layerGroup().addTo(map);
const stationLayer = L.layerGroup().addTo(map);
const meLayer = L.layerGroup().addTo(map);
let curArrow = null;

function drawRoute(){
  routeLayer.clearLayers();
  const r = trip.route;
  if (r.length > 1) L.polyline(r, { color: '#C8167E', weight: 4, opacity: .9 }).addTo(routeLayer);
  r.forEach((p, i) => {
    if (i){
      const a = r[i-1], mid = [(a[0]+p[0])/2, (a[1]+p[1])/2];
      L.tooltip({ permanent: true, direction: 'center', className: 'leg' }).setLatLng(mid)
        .setContent(`${distNm(a,p).toFixed(2)} nm ${magB(brgT(a,p))}`).addTo(routeLayer);
    }
    const isNext = state.paddling && i === state.next;
    const m = L.marker(p, { draggable: state.drawing, icon: L.divIcon({ className: '', html: `<div class="wp${isNext?' next':''}">${i+1}</div>`, iconSize: [26,26], iconAnchor: [13,13] }) }).addTo(routeLayer);
    m.on('dragend', () => { const ll = m.getLatLng(); trip.route[i] = [ll.lat, ll.lng]; changed(); });
    m.bindPopup(() => `<b>Waypoint ${i+1}</b><br>${p[0].toFixed(5)}, ${p[1].toFixed(5)}<br>
      ${state.paddling ? `<button class="btn" data-goto="${i}">Steer here</button>` : `<button class="btn" data-del="${i}">Delete</button>`}`);
  });
}
map.on('click', e => {
  if (!state.drawing) return;
  trip.route.push([+e.latlng.lat.toFixed(6), +e.latlng.lng.toFixed(6)]);
  changed();
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-del],[data-goto],[data-use]'); if (!t) return;
  if (t.dataset.del){ trip.route.splice(+t.dataset.del, 1); map.closePopup(); changed(); }
  if (t.dataset.goto){ state.next = +t.dataset.goto; map.closePopup(); drawRoute(); updateNav(); }
  if (t.dataset.use){ useStation(t.dataset.use, t.dataset.id); map.closePopup(); }
});

/* ---------- stations ---------- */
const stIcon = (kind, label, dim) => L.divIcon({ className: '', html: `<div class="st ${kind}${dim?' dim':''}"><span>${label}</span></div>`, iconSize: [22,22], iconAnchor: [11,11] });
function drawStations(){
  stationLayer.clearLayers();
  if (curArrow){ map.removeLayer(curArrow); curArrow = null; }
  if (trip.tide) L.marker([trip.tide.lat, trip.tide.lng], { icon: stIcon('tide', 'T') }).bindPopup(`<b>Tide station</b><br>${esc(trip.tide.name)}<br><small>${esc(trip.tide.id)}</small>`).addTo(stationLayer);
  if (trip.current) L.marker([trip.current.lat, trip.current.lng], { icon: stIcon('cur', 'C') }).bindPopup(`<b>Current station</b><br>${esc(trip.current.name)}<br><small>${esc(trip.current.id)}${trip.current.depth ? ' · depth '+esc(trip.current.depth)+' ft' : ''}</small>`).addTo(stationLayer);
  if (state.showStations && state.nearby){
    for (const s of state.nearby.tide) if (!trip.tide || s.id !== trip.tide.id)
      L.marker([s.lat, s.lng], { icon: stIcon('tide', 'T', true) }).bindPopup(`<b>${esc(s.name)}</b><br><small>Tide · ${esc(s.id)}</small><br><button class="btn" data-use="tide" data-id="${esc(s.id)}">Use for tides</button>`).addTo(stationLayer);
    for (const s of state.nearby.current) if (!trip.current || s.id !== trip.current.id)
      L.marker([s.lat, s.lng], { icon: stIcon('cur', 'C', true) }).bindPopup(`<b>${esc(s.name)}</b><br><small>Current · ${esc(s.id)}${s.depth ? ' · depth '+esc(s.depth)+' ft':''}</small><br><button class="btn" data-use="current" data-id="${esc(s.id)}">Use for currents</button>`).addTo(stationLayer);
  }
}
async function stationList(type){
  const key = 'st-' + type, c = await idb.get('kv', key);
  if (c && Date.now() - c.at < 30*864e5) return c.list;
  const r = await fetch(`https://api.tidesandcurrents.noaa.gov/mdapi/prod/webapi/stations.json?type=${type}`);
  if (!r.ok) throw new Error('NOAA station list ' + r.status);
  const j = await r.json();
  let list = (j.stations || []).map(s => ({ id: String(s.id), name: s.name, lat: +s.lat, lng: +s.lng, bin: s.currbin ?? s.bin ?? null, depth: s.depth ?? null }))
    .filter(s => isFinite(s.lat) && isFinite(s.lng));
  if (type === 'currentpredictions'){ // one entry per station: shallowest bin
    const by = new Map();
    for (const s of list){ const o = by.get(s.id); if (!o || (+s.depth || 999) < (+o.depth || 999)) by.set(s.id, s); }
    list = [...by.values()];
  }
  await idb.put('kv', { at: Date.now(), list }, key);
  return list;
}
const nearest = (list, c, n) => list.map(s => ({ s, d: distNm(c, [s.lat, s.lng]) })).sort((a, b) => a.d - b.d).slice(0, n).filter(x => x.d < 25).map(x => x.s);
async function loadNearby(){
  const c = centroid();
  const [t, cu] = await Promise.all([stationList('tidepredictions'), stationList('currentpredictions')]);
  state.nearby = { tide: nearest(t, c, 12), current: nearest(cu, c, 15) };
  return state.nearby;
}
async function useStation(kind, id){
  const pool = state.nearby?.[kind] || [];
  const s = pool.find(x => x.id === id); if (!s) return;
  trip[kind] = s; trip.data = trip.data || {};
  try{
    if (kind === 'tide') trip.data.tide = await fetchTide(s);
    else Object.assign(trip.data, await fetchCurrent(s));
    toast(`${kind === 'tide' ? 'Tides' : 'Currents'}: ${s.name}`);
  }catch(err){ toast('Could not load station: ' + err.message); }
  changed();
}

/* ---------- data fetch ---------- */
async function noaa(p){
  const q = new URLSearchParams({ ...p, begin_date: shiftDay(trip.date,-1).replace(/-/g,''), end_date: shiftDay(trip.date,1).replace(/-/g,''), time_zone: 'gmt', units: 'english', format: 'json', application: 'Paddle' });
  const r = await fetch('https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?' + q);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message || 'NOAA error');
  return j;
}
const gmt = s => Date.parse(s.replace(' ', 'T') + 'Z');
async function fetchTide(s){
  const j = await noaa({ product: 'predictions', datum: 'MLLW', interval: 'hilo', station: s.id });
  return (j.predictions || []).map(p => ({ t: gmt(p.t), v: +p.v, type: p.type }));
}
async function fetchCurrent(s){
  const p = { product: 'currents_predictions', interval: 'MAX_SLACK', station: s.id };
  if (s.bin != null) p.bin = s.bin;
  const j = await noaa(p);
  const cp = j.current_predictions?.cp || [];
  const ev = cp.map(x => {
    const type = String(x.Type || '').toLowerCase(); let v = +x.Velocity_Major || 0;
    if (type === 'ebb') v = -Math.abs(v); else if (type === 'flood') v = Math.abs(v); else if (type === 'slack') v = 0;
    return { t: gmt(x.Time), v, type };
  });
  return { current: ev, floodDir: cp[0]?.meanFloodDir ?? null, ebbDir: cp[0]?.meanEbbDir ?? null };
}
async function fetchWx(c){
  const q = new URLSearchParams({ latitude: c[0].toFixed(4), longitude: c[1].toFixed(4),
    hourly: 'temperature_2m,precipitation_probability,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    wind_speed_unit: 'kn', temperature_unit: 'fahrenheit', timezone: 'GMT', start_date: shiftDay(trip.date,-1), end_date: shiftDay(trip.date,1) });
  const r = await fetch('https://api.open-meteo.com/v1/forecast?' + q);
  const j = await r.json();
  if (j.error) throw new Error(j.reason || 'weather error');
  const h = j.hourly;
  return { t: h.time.map(s => Date.parse(s + 'Z')), temp: h.temperature_2m, pop: h.precipitation_probability, code: h.weather_code, ws: h.wind_speed_10m, wd: h.wind_direction_10m, wg: h.wind_gusts_10m };
}

async function getForecast(){
  if (!navigator.onLine){ toast('You are offline. Connect to get a forecast.'); return; }
  const btn = $('#fcBtn'); btn.disabled = true; btn.textContent = 'Loading…';
  const errs = [];
  try{
    const c = centroid();
    try{
      const nb = await loadNearby();
      if (!trip.tide || distNm(c, [trip.tide.lat, trip.tide.lng]) > 25) trip.tide = nb.tide[0] || null;
      if (!trip.current || distNm(c, [trip.current.lat, trip.current.lng]) > 25) trip.current = nb.current[0] || null;
    }catch(e){ errs.push('stations'); }
    const data = trip.data || {};
    const [t, cu, w] = await Promise.allSettled([
      trip.tide ? fetchTide(trip.tide) : Promise.reject(new Error('none nearby')),
      trip.current ? fetchCurrent(trip.current) : Promise.reject(new Error('none nearby')),
      fetchWx(c)
    ]);
    if (t.status === 'fulfilled') data.tide = t.value; else { data.tide = null; errs.push('tides (' + t.reason.message + ')'); }
    if (cu.status === 'fulfilled') Object.assign(data, cu.value); else { data.current = null; errs.push('currents (' + cu.reason.message + ')'); }
    if (w.status === 'fulfilled') data.wx = w.value; else { data.wx = null; errs.push('weather (' + w.reason.message + ')'); }
    trip.data = data; trip.fetchedAt = Date.now();
    changed();
    btn.textContent = 'Saving map…';
    const n = await cacheTiles();
    toast(errs.length ? 'Missing: ' + errs.join(', ') : `Forecast saved. ${n} map tiles stored for offline.`, 4500);
  }finally{ btn.disabled = false; btn.textContent = 'Get forecast'; }
}

/* ---------- offline tiles ---------- */
async function cacheTiles(){
  if (!('caches' in window)) return 0;
  const pts = trip.route.length ? trip.route : [centroid()];
  let b = L.latLngBounds(pts);
  b = L.latLngBounds([b.getSouth() - .03, b.getWest() - .04], [b.getNorth() + .03, b.getEast() + .04]);
  const L0 = LAYERS[settings.layer], urls = [];
  const tx = (lng, n) => Math.floor((lng + 180) / 360 * n);
  const ty = (lat, n) => { const r = toR(lat); return Math.floor((1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * n); };
  for (let z = 10; z <= 16; z++){
    const n = 2 ** z, x0 = tx(b.getWest(), n), x1 = tx(b.getEast(), n), y0 = ty(b.getNorth(), n), y1 = ty(b.getSouth(), n);
    const add = [];
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) add.push(L0.url.replace('{z}', z).replace('{x}', x).replace('{y}', y));
    if (urls.length + add.length > 1500) break;
    urls.push(...add);
  }
  const cache = await caches.open('paddle-tiles');
  let done = 0, i = 0;
  const worker = async () => {
    while (i < urls.length){
      const u = urls[i++];
      try{
        if (!(await cache.match(u))){
          let r; try{ r = await fetch(u, { mode: 'cors' }); }catch{ r = await fetch(u, { mode: 'no-cors' }); }
          if (r.ok || r.type === 'opaque') await cache.put(u, r);
        }
      }catch{}
      if (++done % 25 === 0) $('#fcBtn').textContent = `Map ${Math.round(done / urls.length * 100)}%`;
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  return urls.length;
}

/* ---------- interpolation ---------- */
function seg(arr, t){
  if (!arr || arr.length < 2) return null;
  for (let i = 0; i < arr.length - 1; i++) if (t >= arr[i].t && t <= arr[i+1].t) return [arr[i], arr[i+1], (t - arr[i].t) / (arr[i+1].t - arr[i].t)];
  return null;
}
function tideAt(t){
  const s = seg(trip.data?.tide, t); if (!s) return null;
  const [a, b, f] = s;
  return { v: (a.v + b.v)/2 + (a.v - b.v)/2 * Math.cos(Math.PI * f), rising: b.v > a.v, next: b };
}
function curAt(t){
  const s = seg(trip.data?.current, t); if (!s) return null;
  const [a, b, f] = s;
  return { v: a.v + (b.v - a.v) * (1 - Math.cos(Math.PI * f)) / 2, next: b };
}
function wxAt(t){
  const w = trip.data?.wx; if (!w) return null;
  let bi = -1, bd = Infinity;
  w.t.forEach((x, i) => { const d = Math.abs(x - t); if (d < bd){ bd = d; bi = i; } });
  if (bi < 0 || bd > 2*36e5) return null;
  return { ws: w.ws[bi], wd: w.wd[bi], wg: w.wg[bi], temp: w.temp[bi], pop: w.pop[bi], code: w.code[bi] };
}
function wxText(c){
  if (c == null) return '';
  if (c === 0) return 'Clear'; if (c === 1) return 'Mostly clear'; if (c === 2) return 'Partly cloudy'; if (c === 3) return 'Overcast';
  if (c === 45 || c === 48) return 'Fog'; if (c >= 51 && c <= 57) return 'Drizzle'; if (c >= 61 && c <= 67) return 'Rain';
  if (c >= 71 && c <= 77) return 'Snow'; if (c >= 80 && c <= 82) return 'Showers'; if (c >= 95) return 'Thunderstorm'; return '';
}

/* ---------- render ---------- */
function render(){
  const t = tAt();
  $('#time').value = state.tMin;
  $('#timeOut').textContent = hm(t);
  $('#tripBtn').textContent = trip.name;
  $('#date').value = trip.date;

  const nm = routeNm(trip.route), legs = Math.max(0, trip.route.length - 1);
  $('#dist').textContent = nm.toFixed(1) + ' nm';
  $('#legs').textContent = legs ? `${legs} leg${legs > 1 ? 's' : ''} · ${fmtDur(nm / settings.speed)} at ${settings.speed} kt` : 'Tap Draw to plot a route';

  const td = tideAt(t);
  $('#tideK').textContent = trip.tide ? 'Tide · ' + trip.tide.name : 'Tide';
  $('#tideV').textContent = td ? td.v.toFixed(1) + ' ft' : '–';
  $('#tideS').textContent = td ? `${td.rising ? 'Rising' : 'Falling'} · ${td.next.type === 'H' ? 'high' : 'low'} ${td.next.v.toFixed(1)} at ${hm(td.next.t)}` : '\u00a0';

  const cu = curAt(t), cv = $('#curV');
  $('#curK').textContent = trip.current ? 'Current · ' + trip.current.name : 'Current';
  cv.className = 'v';
  if (cu){
    const flood = cu.v >= 0, dir = flood ? trip.data.floodDir : trip.data.ebbDir, sp = Math.abs(cu.v);
    cv.textContent = sp < .1 ? 'Slack' : `${sp.toFixed(1)} kt ${flood ? 'flood' : 'ebb'}`;
    if (sp >= .1) cv.classList.add(flood ? 'flood' : 'ebb');
    const nx = cu.next;
    $('#curS').textContent = `${dir != null && sp >= .1 ? 'toward ' + d3(dir) + '°T · ' : ''}${nx.type === 'slack' ? 'slack' : 'max ' + nx.type + ' ' + Math.abs(nx.v).toFixed(1)} at ${hm(nx.t)}`;
    drawCurArrow(sp >= .1 ? dir : null, sp, flood);
  } else { cv.textContent = '–'; $('#curS').textContent = '\u00a0'; drawCurArrow(null); }

  const w = wxAt(t);
  $('#windV').textContent = w ? `${Math.round(w.ws)} kt ${compass(w.wd)}` : '–';
  $('#windS').textContent = w ? `gusts ${Math.round(w.wg)} · ${Math.round(w.temp)}°F · ${wxText(w.code)}${w.pop != null ? ' · ' + w.pop + '% rain' : ''}` : '\u00a0';

  const c = centroid(), sun = sunTimes(trip.date, c[0], c[1]);
  $('#sunV').textContent = sun.rise ? `${hm(sun.rise)} – ${hm(sun.set)}` : '–';
  $('#sunS').textContent = sun.dawn ? `First light ${hm(sun.dawn)} · last ${hm(sun.dusk)}` : '\u00a0';

  const st = $('#status'); st.classList.remove('warn');
  if (!trip.fetchedAt) st.textContent = 'No forecast yet. Plot a route, then tap Get forecast.';
  else {
    const age = Date.now() - trip.fetchedAt, future = dayStart() + 864e5 > Date.now();
    st.textContent = `Forecast from ${new Date(trip.fetchedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`;
    if (!trip.data?.wx) { st.textContent += ' · no wind forecast (only available up to 16 days ahead)'; st.classList.add('warn'); }
    else if (future && age > 18*36e5){ st.textContent += ' · refresh before you go'; st.classList.add('warn'); }
  }
  drawChart(sun);
  if (state.paddling) updateNav();
}
const fmtDur = h => { const m = Math.round(h * 60); return m < 60 ? `${m} min` : `${Math.floor(m/60)} h ${String(m % 60).padStart(2,'0')}`; };

function drawCurArrow(dir, sp, flood){
  if (curArrow){ map.removeLayer(curArrow); curArrow = null; }
  if (dir == null || !trip.current) return;
  const len = 22 + Math.min(sp, 5) * 9, col = flood ? '#1F6FB2' : '#2E8B57';
  const html = `<svg width="${len*2}" height="${len*2}" viewBox="${-len} ${-len} ${len*2} ${len*2}" style="transform:rotate(${dir}deg)">
    <line x1="0" y1="${len-6}" x2="0" y2="${-len+10}" stroke="${col}" stroke-width="5" stroke-linecap="round"/>
    <path d="M-9 ${-len+14} L0 ${-len+1} L9 ${-len+14} Z" fill="${col}"/></svg>`;
  curArrow = L.marker([trip.current.lat, trip.current.lng], { interactive: false, icon: L.divIcon({ className: 'arrow', html, iconSize: [len*2, len*2], iconAnchor: [len, len] }) }).addTo(map);
}

/* ---------- day chart ---------- */
const cv = $('#chart');
function drawChart(sun){
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (!W) return;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const t0 = dayStart(), t1 = t0 + 864e5, X = t => (t - t0) / (t1 - t0) * W;
  // night
  g.fillStyle = 'rgba(18,50,74,.10)';
  if (sun.rise){ g.fillRect(0, 0, X(sun.rise), H); g.fillRect(X(sun.set), 0, W - X(sun.set), H); }
  // hour grid
  g.fillStyle = '#5B7183'; g.font = '10px ' + getComputedStyle(document.body).fontFamily;
  for (let h = 3; h < 24; h += 3){ const x = X(t0 + h*36e5); g.fillRect(x, H - 4, 1, 4); g.fillText(h === 12 ? '12p' : (h > 12 ? h - 12 + 'p' : h + 'a'), x + 2, H - 2); }
  const mid = H * .55;
  // currents
  if (trip.data?.current){
    let mx = 1; for (let x = 0; x <= W; x += 3){ const c = curAt(t0 + x / W * 864e5); if (c) mx = Math.max(mx, Math.abs(c.v)); }
    const sc = (H * .42) / mx;
    for (let x = 0; x <= W; x += 2){
      const c = curAt(t0 + x / W * 864e5); if (!c) continue;
      g.fillStyle = c.v >= 0 ? 'rgba(31,111,178,.55)' : 'rgba(46,139,87,.55)';
      g.fillRect(x, c.v >= 0 ? mid - c.v * sc : mid, 2, Math.abs(c.v) * sc);
    }
    g.fillStyle = 'rgba(18,50,74,.25)'; g.fillRect(0, mid, W, 1);
  }
  // tide
  if (trip.data?.tide){
    let lo = Infinity, hi = -Infinity;
    for (let x = 0; x <= W; x += 3){ const d = tideAt(t0 + x / W * 864e5); if (d){ lo = Math.min(lo, d.v); hi = Math.max(hi, d.v); } }
    if (isFinite(lo)){
      const Y = v => 8 + (1 - (v - lo) / Math.max(.5, hi - lo)) * (H - 22);
      g.strokeStyle = '#12324A'; g.lineWidth = 2; g.beginPath(); let first = true;
      for (let x = 0; x <= W; x += 2){ const d = tideAt(t0 + x / W * 864e5); if (!d) { first = true; continue; } first ? g.moveTo(x, Y(d.v)) : g.lineTo(x, Y(d.v)); first = false; }
      g.stroke();
    }
  }
  if (!trip.data?.tide && !trip.data?.current){ g.fillStyle = '#5B7183'; g.font = '13px ' + getComputedStyle(document.body).fontFamily; g.fillText('Tide and current graph appears after Get forecast', 8, 22); }
  // cursor
  const cx = X(tAt()); g.fillStyle = '#C8167E'; g.fillRect(cx - 1, 0, 2, H);
}
function chartTouch(e){
  const r = cv.getBoundingClientRect(), x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  state.tMin = Math.max(0, Math.min(1435, Math.round(x / r.width * 1440 / 5) * 5)); state.follow = false; render();
}
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); chartTouch(e); });
cv.addEventListener('pointermove', e => { if (e.buttons) chartTouch(e); });
$('#time').addEventListener('input', e => { state.tMin = +e.target.value; state.follow = false; render(); });
function setNow(){
  const now = new Date();
  if (ymd(now) !== trip.date){ toast('Trip is on ' + trip.date + '. Showing that day.'); return false; }
  state.tMin = Math.floor((now.getHours() * 60 + now.getMinutes()) / 5) * 5; render(); return true;
}
$('#nowBtn').onclick = () => { if (setNow()) state.follow = true; };

/* ---------- save / load ---------- */
let saveT;
function changed(){
  trip.updated = Date.now();
  drawRoute(); drawStations(); render();
  clearTimeout(saveT); saveT = setTimeout(() => { idb.put('trips', trip); LS.set('lastTrip', trip.id); }, 300);
}
async function openTrip(t){
  trip = t; state.next = 1; LS.set('lastTrip', t.id);
  drawRoute(); drawStations(); render();
  if (t.route.length) map.fitBounds(L.latLngBounds(t.route), { paddingTopLeft: [30, 70], paddingBottomRight: [30, 380], maxZoom: 15 });
}

$('#doneBtn').onclick = () => { setDrawing(false); $('#panel').classList.remove('min'); };

/* ---------- paddle mode ---------- */
$('#goBtn').onclick = () => state.paddling ? stopPaddle() : startPaddle();
$('#stopBtn').onclick = stopPaddle;
async function startPaddle(){
  if (trip.route.length < 2) return toast('Plot a route with at least 2 waypoints first.');
  if (!('geolocation' in navigator)) return toast('GPS is not available on this device.');
  setDrawing(false);
  state.paddling = true; state.next = 1; $('#nav').hidden = false; $('#goBtn').classList.add('on'); $('#goBtn').textContent = 'Stop';
  state.follow = setNow();
  state.watch = navigator.geolocation.watchPosition(onPos, err => toast('GPS: ' + err.message), { enableHighAccuracy: true, maximumAge: 2000, timeout: 30000 });
  try{ state.wake = await navigator.wakeLock?.request('screen'); }catch{}
  drawRoute(); updateNav();
}
function stopPaddle(){
  state.paddling = false; $('#nav').hidden = true; $('#goBtn').classList.remove('on'); $('#goBtn').textContent = 'Paddle';
  if (state.watch != null) navigator.geolocation.clearWatch(state.watch); state.watch = null;
  try{ state.wake?.release(); }catch{} state.wake = null;
  drawRoute();
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && state.paddling && !state.wake){ try{ state.wake = await navigator.wakeLock?.request('screen'); }catch{} }
  if (document.visibilityState === 'hidden') state.wake = null;
});
let firstFix = true;
function onPos(p){
  const c = p.coords;
  state.pos = [c.latitude, c.longitude];
  state.sog = c.speed != null && !isNaN(c.speed) ? c.speed * 1.94384 : null;
  showMe(state.pos, c.accuracy);
  if (firstFix){ map.setView(state.pos, Math.max(map.getZoom(), 14)); firstFix = false; }
  const r = trip.route;
  while (state.next < r.length - 1 && distNm(state.pos, r[state.next]) < 0.05){ state.next++; drawRoute(); toast('Waypoint reached. Next: ' + (state.next + 1)); }
  if (state.follow){ const now = new Date(); state.tMin = Math.floor((now.getHours()*60 + now.getMinutes()) / 5) * 5; render(); }
  else updateNav();
}
function updateNav(){
  const r = trip.route; if (!state.paddling) return;
  $('#navTo').textContent = `To ${state.next + 1}`;
  if (!state.pos){ $('#navDist').textContent = '–'; $('#navLeft').textContent = 'Waiting for GPS…'; return; }
  const tgt = r[state.next], d = distNm(state.pos, tgt);
  let rest = d; for (let i = state.next + 1; i < r.length; i++) rest += distNm(r[i-1], r[i]);
  const spd = state.sog != null && state.sog > 0.5 ? state.sog : settings.speed;
  $('#navDist').textContent = d < 0.1 ? Math.round(d * 1852) + ' m' : d.toFixed(2) + ' nm';
  $('#navBrg').textContent = magB(brgT(state.pos, tgt)).replace('°M', '°');
  $('#navSog').textContent = state.sog != null ? state.sog.toFixed(1) : '–';
  $('#navEta').textContent = hm(Date.now() + rest / spd * 36e5);
  const arrived = state.next === r.length - 1 && d < 0.05;
  $('#navLeft').textContent = arrived ? 'Arrived' : `${rest.toFixed(2)} nm to finish · bearing is magnetic · speed in kt`;
}
function showMe(p, acc){
  meLayer.clearLayers();
  if (acc) L.circle(p, { radius: acc, color: '#1a73e8', weight: 1, fillOpacity: .08, interactive: false }).addTo(meLayer);
  L.marker(p, { interactive: false, icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [18,18], iconAnchor: [9,9] }) }).addTo(meLayer);
}
$('#locBtn').onclick = () => {
  if (state.pos && state.paddling) return map.setView(state.pos, Math.max(map.getZoom(), 14));
  navigator.geolocation?.getCurrentPosition(p => { const ll = [p.coords.latitude, p.coords.longitude]; showMe(ll, p.coords.accuracy); map.setView(ll, Math.max(map.getZoom(), 14)); },
    e => toast('Location unavailable: ' + e.message), { enableHighAccuracy: true, timeout: 15000 });
};

sheet.addEventListener('click', e => { if (e.target === sheet || e.target.closest('[data-close]')) sheet.close(); });

$('#menuBtn').onclick = () => openSheet(`<h2>Menu</h2><div class="menu">
  <button id="mTrips">My trips</button>
  <button id="mNew">New trip</button>
  <button id="mRename">Rename this trip</button>
  <button id="mStations">${state.showStations ? 'Hide' : 'Choose'} tide and current stations</button>
  <button id="mJson">Export trip (.json)</button>
  <button id="mGpx">Export route (.gpx)</button>
  <button id="mImport">Import trip or GPX</button>
  <button id="mSettings">Settings</button>
  <button id="mAbout">About</button></div>`);
sheet.addEventListener('click', async e => {
  const id = e.target.id;
  if (id === 'mTrips') return tripsSheet();
  if (id === 'mNew'){ sheet.close(); stopPaddle(); const t = newTrip(); await idb.put('trips', t); openTrip(t); setDrawing(true); return; }
  if (id === 'mRename'){ sheet.close(); const n = prompt('Trip name', trip.name); if (n && n.trim()){ trip.name = n.trim(); changed(); } return; }
  if (id === 'mStations'){
    sheet.close(); state.showStations = !state.showStations;
    if (state.showStations){
      try{ await loadNearby(); toast('Tap a faded T or C marker to use that station.'); }
      catch{ state.showStations = false; toast('Station list needs a connection.'); }
    }
    return drawStations();
  }
  if (id === 'mJson'){ sheet.close(); return shareFile(fileName('json'), JSON.stringify({ app: 'Paddle', version: 1, trip }, null, 1), 'application/json'); }
  if (id === 'mGpx'){ sheet.close(); if (trip.route.length < 1) return toast('No route to export.'); return shareFile(fileName('gpx'), toGpx(), 'application/gpx+xml'); }
  if (id === 'mImport'){ sheet.close(); return $('#file').click(); }
  if (id === 'mSettings') return settingsSheet();
  if (id === 'mAbout') return openSheet(`<h2>Paddle</h2>
    <p>Plan a kayak trip online, then use it offline. Tides and currents: NOAA CO-OPS. Wind and weather: Open-Meteo. Map: NOAA charts or OpenStreetMap. Sun times are calculated on the phone.</p>
    <p>Tide and current curves are smoothed between NOAA high/low and slack/max predictions. Current directions are mean flood and ebb directions in degrees true.</p>
    <p class="danger"><b>Not for navigation.</b> Check official forecasts and conditions before you launch.</p>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
  if (e.target.dataset.open){ const t = await idb.get('trips', e.target.dataset.open); sheet.close(); stopPaddle(); return openTrip(t); }
  if (e.target.dataset.rm){
    const rid = e.target.dataset.rm;
    if (!confirm('Delete this trip?')) return;
    await idb.del('trips', rid);
    if (rid === trip.id){ const t = newTrip(); await idb.put('trips', t); openTrip(t); }
    return tripsSheet();
  }
  if (id === 'sSave'){
    const sp = +$('#sSpeed').value, va = +$('#sVar').value;
    if (sp > 0) settings.speed = sp; if (isFinite(va)) settings.variation = va;
    saveSettings(); sheet.close(); changed(); toast('Settings saved');
  }
});
async function tripsSheet(){
  const all = (await idb.all('trips')).sort((a, b) => b.date.localeCompare(a.date) || b.updated - a.updated);
  openSheet(`<h2>My trips</h2><div class="list">${all.map(t => `<div class="item">
      <div class="grow"><b>${esc(t.name)}</b><small>${esc(t.date)} · ${routeNm(t.route).toFixed(1)} nm${t.fetchedAt ? ' · forecast saved' : ''}</small></div>
      <button class="btn" data-open="${esc(t.id)}">Open</button><button class="btn" data-rm="${esc(t.id)}" aria-label="Delete ${esc(t.name)}">✕</button></div>`).join('') || '<p>No trips yet.</p>'}</div>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
}
function settingsSheet(){
  openSheet(`<h2>Settings</h2>
    <label for="sSpeed">Paddling speed (kt)</label><input id="sSpeed" type="number" step="0.1" min="0.5" value="${settings.speed}">
    <label for="sVar">Magnetic variation (° east)</label><input id="sVar" type="number" step="0.5" value="${settings.variation}">
    <p><small>SF Bay is about 13° E. Bearings are shown magnetic (°M).</small></p>
    <div class="row"><button class="btn" data-close>Cancel</button><button class="btn" id="sSave">Save</button></div>`);
}
function routeSheet(){
  const r = trip.route; if (r.length < 2) return toast('Tap Draw and add at least 2 waypoints.');
  let cum = 0, start = tAt();
  const rows = r.map((p, i) => {
    if (!i) return `<tr><td>1</td><td>–</td><td>–</td><td>0.00</td><td>${hm(start)}</td></tr>`;
    const d = distNm(r[i-1], p); cum += d;
    return `<tr><td>${i+1}</td><td>${d.toFixed(2)}</td><td>${magB(brgT(r[i-1], p))}</td><td>${cum.toFixed(2)}</td><td>${hm(start + cum / settings.speed * 36e5)}</td></tr>`;
  }).join('');
  openSheet(`<h2>Route</h2><p><small>Times assume departure at ${hm(start)} (the time slider) and ${settings.speed} kt, without current.</small></p>
    <table><tr><th>WP</th><th>Leg nm</th><th>Bearing</th><th>Total nm</th><th>Arrive</th></tr>${rows}</table>
    <div class="row"><button class="btn" data-close>Close</button></div>`);
}

/* ---------- export / import ---------- */
const fileName = ext => `${trip.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'trip'}_${trip.date}.${ext}`;
function toGpx(){
  const pts = trip.route.map((p, i) => `  <rtept lat="${p[0]}" lon="${p[1]}"><name>WP${i+1}</name></rtept>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Paddle" xmlns="http://www.topografix.com/GPX/1/1">\n <rte><name>${esc(trip.name)}</name>\n${pts}\n </rte>\n</gpx>\n`;
}
async function shareFile(name, text, type){
  const file = new File([text], name, { type });
  try{ if (navigator.canShare?.({ files: [file] })){ await navigator.share({ files: [file], title: name }); return; } }catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  const text = await f.text();
  try{
    let t;
    if (/\.gpx$/i.test(f.name) || text.trimStart().startsWith('<')){
      const x = new DOMParser().parseFromString(text, 'application/xml');
      let pts = [...x.getElementsByTagName('rtept')];
      if (!pts.length) pts = [...x.getElementsByTagName('trkpt')];
      if (!pts.length) pts = [...x.getElementsByTagName('wpt')];
      if (!pts.length) throw new Error('No points found in GPX');
      if (pts.length > 200) pts = pts.filter((_, i) => i % Math.ceil(pts.length / 200) === 0);
      t = newTrip();
      t.name = x.querySelector('rte>name,trk>name,metadata>name')?.textContent?.trim() || f.name.replace(/\.gpx$/i, '');
      t.route = pts.map(p => [+(+p.getAttribute('lat')).toFixed(6), +(+p.getAttribute('lon')).toFixed(6)]);
    } else {
      const j = JSON.parse(text); t = j.trip || j;
      if (!Array.isArray(t.route) || !t.date) throw new Error('Not a Paddle trip file');
      t.id = t.id || newTrip().id;
      if (await idb.get('trips', t.id)) t.id = newTrip().id;
    }
    t.updated = Date.now();
    await idb.put('trips', t); stopPaddle(); openTrip(t); toast('Imported ' + t.name);
  }catch(err){ toast('Import failed: ' + err.message, 4000); }
};

/* ---------- start ---------- */
(async () => {
  let t = null; const last = LS.get('lastTrip');
  try{ if (last) t = await idb.get('trips', last); }catch{}
  if (!t){ t = newTrip(); try{ await idb.put('trips', t); }catch{} }
  await openTrip(t);
  if (ymd(new Date()) === trip.date) setNow();
  else render();
})();
addEventListener('resize', () => render());
addEventListener('offline', () => toast('Offline. Saved trips still work.'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
